s prises en charge, la réplication de snapshots n'acceptant qu'une seule de ces cibles à la fois. L'étape 2 demande donc de déconnecter la cible SnapToNFS puis de connecter la nouvelle cible CloudSnap, avec un nom différent de l'ancienne. B est écartée : c'est exactement ce que la limitation interdit. La migration de snapshots de NFS vers CloudSnap passe par une restauration manuelle sur la baie puis une nouvelle réplication. C est écartée, et c'est même l'inverse : la transition doit être faite sur une version qui gère encore SnapToNFS (Purity 6.5 ou antérieure), donc avant la mise à niveau. Après le passage en 6.6.0 ou plus, les snapshots restés sur la cible NFS ne sont plus accessibles.","s": ["CloudSnap — Legacy Support › SnapToNFS transition to CloudSnap › Limitations, p. 119 : Les connexions simultanées CloudSnap et SnapToNFS ne sont pas prises en charge : une seule de ces cibles à la fois. Migration des snapshots possible seulement par restauration manuelle puis réplication. C'est la source la plus directe.","CloudSnap — SnapToNFS transition to CloudSnap › Transition, étapes 1 à 4 et note, p. 119 : Étape 2 : déconnecter la cible SnapToNFS et connecter la nouvelle cible CloudSnap « with a different target name » ; les noms des deux cibles doivent être différents.","CloudSnap — SnapToNFS transition to CloudSnap (introduction et notes), p. 118-119 : SnapToNFS n'est plus pris en charge à partir de Purity 6.6.0 ; la transition doit se faire en 6.5 ou antérieur ; les snapshots d'une cible SnapToNFS deviennent indisponibles après la mise à niveau en 6.6.0 ou plus (écarte C).","CloudSnap — CloudSnap Requirements and Limitations › CloudSnap with SnapToNFS, p. 10 : CloudSnap n'est pas compatible avec SnapToNFS : la baie est connectée soit à une cible cloud, soit à une cible NFS.","CloudSnap — Legacy Support › Snap to NFS Overview and Administration › Limitations › Snap to NFS with CloudSnap, p. 89 : Une seule cible d'offload peut être connectée à un FlashArray à la fois.","FASS_Module04_02_ActiveWorkload_ActiveDR_Offload_FR.docx (support vidéo FASS, module 04) — Slide « Passer de Snap to NFS à CloudSnap » et transcription de 24:57 à 25:55 ; tableau de dépannage de l'offload, p. 40 (tableau p. 2) : Faire la transition tant que l'on est en 6.5, avant la mise à niveau : créer la cible CloudSnap, déconnecter la cible Snap to NFS et connecter la nouvelle cible avec un nom différent."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 26,"c": "4.02","q": "Queue time is made of which block driver stages?","o": ["cmd_to_alloc and alloc_buf","alloc_buf and alloc_done_to_exec","alloc_done_to_exec and qos_wait"],"a": [0],"e": "Dans la formation FASS, le pilote bloc (LIO + ps_bdrv) chronomètre quatre étapes : cmd_to_alloc, alloc_buf, alloc_done_to_exec et exec_done_to_dropoff. Le queue time correspond à la première partie du trajet : recevoir la requête et allouer le tampon, c'est-à-dire cmd_to_alloc (traitement de la commande avant la demande de tampon) puis alloc_buf (allocation du tampon). La documentation Performance confirme que la latence de file apparaît dans le pilote à l'étape cmd_to_alloc. B et C sont écartées parce qu'elles contiennent alloc_done_to_exec : cette étape mesure l'attente entre l'allocation des tampons et l'arrivée des données de l'hôte. C'est du SAN time (externe à la baie), pas du queue time. C cite en plus qos_wait, qui n'est pas une étape du pilote bloc : la pause QoS a lieu dans la phase Purity (qos suspend / qos resume), même si elle est comptée elle aussi dans la file.","s": ["FASS_Module03_Performance_FR.docx (support vidéo FASS, module 03) — Slide « Mesurer la latence (SCSI) : tout le processus » (11:14), rubrique « Les trois catégories », p. 16 : Étapes du pilote : cmd_to_alloc → alloc_buf → alloc_done_to_exec → exec_done_to_dropoff. Catégories : Queue = recevoir la requête et allouer le tampon ; SAN = l'hôte remplit le tampon ; Queue aussi pour la pause QoS. C'est la source la plus directe.","FASS_Module03_Performance_FR.docx (support vidéo FASS, module 03) — Slide « Statistiques vbus : queue, SAN et service » et transcription à 18:27, p. 19 : La première partie du queue time correspond à la réception de la requête et à l'allocation du tampon ; le SAN time est le temps que l'hôte met à remplir le tampon.","FlashArray Performance — Troubleshooting › Performance Troubleshooting › Using Visual Perf Report to Further Your Investigation (passage citant le wiki sur les driver stalls), p. 57 : La latence de file apparaît dans le pilote ps_bdrv à l'étape cmd_to_alloc : temps de traitement de la commande SCSI avant la demande d'allocation d'un tampon, y compris l'attente quand le pool de tampons est épuisé.","Authorized Support Partner (ASP) Handbook — Latency Concepts and Analysis › Analyzing Latency › Reviewing Array Statistics Report (exemple de driver stalls, après « Write Stalls »), p. 55 : alloc_done_to_exec : la baie a alloué les tampons et attend les données de l'hôte (écarte B et C).","FASS_Module03_Performance_FR.docx (support vidéo FASS, module 03) — Slide « Les étapes de Purity » (14:22), p. 17-18 : La pause QoS (qos suspend / qos resume) appartient à la phase Purity, après le pilote LIO."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 27,"c": "3.03","q": "An NFS client reaches the FlashArray File Services IP address, and the export policy allows the client IP, but individual users still cannot access the data. What is the most likely cause of this issue?","o": ["The export policy must be changed because user authentication is evaluated before client access.","Client authentication is failing before the export policy is evaluated.","User authentication is failing after the client connection is accepted."],"a": [2],"e": "La documentation FA File distingue deux couches : l'authentification du client (la machine), fondée sur l'adresse IP et les règles de la politique d'export, et l'authentification de l'utilisateur, qui vérifie l'identité du compte pour chaque opération sur les fichiers. Ici la première couche est passée (le client atteint l'IP et son adresse est autorisée par la politique d'export) ; si des utilisateurs restent bloqués, c'est donc la seconde couche qui échoue, après l'acceptation de la connexion du client. En NFS classique (AUTH_SYS), l'utilisateur n'est d'ailleurs pas authentifié au montage, mais ensuite, à partir des UID/GID fournis à chaque opération. B est écartée : l'authentification du client, c'est justement la consultation de la politique d'export, et l'énoncé dit qu'elle autorise l'IP du client. A est écartée : l'ordre est inversé. Le contrôle du client (politique d'export) intervient au montage, avant celui de l'utilisateur, et la politique d'export est déjà correcte.","s": ["FlashArray File ServicesFlashArray File Services — FlashArray File - Overview › FlashArray File Services Authentication and Authorization › Client and User Authentication Mechanisms (Client Authentication, User authentication), p. 105 : Deux couches : authentification du client (IP, règles de la politique d'export, « gatekeeper at the machine level ») et authentification de l'utilisateur (identité du compte qui agit sur les fichiers). C'est la source la plus directe.","FlashArray File ServicesFlashArray File Services — Client and User Authentication Mechanisms (résumé) et Protocol-Specific User Authentication, p. 106 : L'authentification du client passe par les politiques d'export basées sur l'IP ; en NFS AUTH_SYS, l'utilisateur n'est pas authentifié au montage, la baie s'appuie sur les identifiants fournis par le client à chaque opération.","FlashArray File ServicesFlashArray File Services — Protocol-Specific User Authentication › NFS (AUTH_SYS) et récapitulatif, p. 107-108 : Pas d'authentification utilisateur au moment du montage en AUTH_SYS ; avec Kerberos, elle a lieu à l'établissement de la session NFSv4.1.","purity_fa_admin_guide_pdf_6122.pdf (Purity//FA Administration Guide 6.12.2) — Auth_Sys and User Mapping, p. 56 : AUTH_SYS est l'authentification utilisateur par défaut des services de fichiers NFS, avec correspondance des utilisateurs (user mapping).","FASS_Module04_FA_File_Services_FR.docx (support vidéo FASS, module 04 FA File) — Slides sur les politiques d'export NFS (règle : client, accès, anonuid, anongid, permission), p. 10 et p. 12 : Une règle d'export NFS porte sur le client (adresse), pas sur l'identité des utilisateurs."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 28,"c": "2.02","q": "What command should a Support Specialist run to check middleware health?","o": ["pureadm status","service status middleware","pureservice middleware status"],"a": [0],"e": "La procédure de health check le dit explicitement, dans sa partie ActiveCluster : pour s'assurer que le middleware est sain, lancer pureadm status sur les deux baies et vérifier que le middleware est à l'état « working ». La sortie de pureadm status liste tous les processus Purity, dont deux lignes pour le middleware : « middleware start/running » et « middleware working ». B et C sont écartées : ni « service status middleware » ni « pureservice » n'apparaissent dans les documents fournis. La commande documentée pour l'état des processus Purity, middleware compris, est pureadm status.","s": ["Purity__FA General Administration — Doing a Health Check on a FlashArray › Active Cluster is Enabled, p. 26-27 : Le middleware est essentiel pour la resynchronisation ActiveCluster ; vérifier sa santé en lançant pureadm status sur les deux baies et en contrôlant qu'il est « in a \"working\" status » ; exemple de sortie avec « middleware working ». C'est la source la plus directe.","Purity__FA General Administration — Doing a Health Check on a FlashArray › Summarized Health Checks - Live CLI › Purity Status, p. 24 : Vérifier que tous les processus Purity tournent : pureadm status, sur les deux contrôleurs.","Purity__FA General Administration — Doing a Health Check on a FlashArray › Live on the Array - Command-Line Health Checks (exemple de sortie de pureadm status), p. 31-32 : On attend « start/running » et « working » sur tous les services ; la sortie contient les lignes « middleware start/running » et « middleware working ».","FASS_Module02_Software_FR.docx (support vidéo FASS, module 02) — Slide « Architecture -- vue d'une seule baie » (35:50), p. 39 : Rôle du middleware : point d'entrée des API de la baie (REST API → middleware → fusiond)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 29,"c": "4.01","q": "A support toolkit capture shows repeated driver-stage delays for a workload, including cmd_to_alloc events during busy periods. How should the Support Specialist interpret these results?","o": ["The delay occurs because the host is slow to fill the allocated buffers.","The delay occurs further down the I/O path, indicating an internal bottleneck that requires deeper performance investigation.","The delay is caused by a QoS rate limit rather than a stall in the allocation stage."],"a": [1],"e": "cmd_to_alloc mesure le temps passé avant la demande d'allocation d'un tampon du pilote. Une valeur élevée signifie que le pool de tampons est épuisé et que les nouvelles E/S attendent leur tour dans une file. La formation FASS explique que cela arrive lors de tempêtes d'E/S ou quand la charge pousse la baie au-delà de ses limites et remplit la NVRAM : les tampons ne se libèrent plus assez vite parce que quelque chose coince plus loin dans le traitement (NVRAM, CPU, back-end). Le symptôme est à l'entrée, la cause est en aval : c'est un goulot interne à analyser plus en profondeur. A est écartée : l'hôte lent à remplir les tampons déjà alloués correspond à l'étape alloc_done_to_exec (SAN time), pas à cmd_to_alloc, où le tampon n'est pas encore attribué. C est écartée : cmd_to_alloc est précisément un blocage avant l'allocation des tampons. Une limite de débit QoS apparaît sous sa propre métrique (QoS rate limit time) et s'applique dans la phase Purity, après le pilote.","s": ["FlashArray Performance — Troubleshooting › Performance Troubleshooting › Using Visual Perf Report to Further Your Investigation (définition de cmd_to_alloc, wiki driver stalls), p. 57 : cmd_to_alloc = temps avant la demande d'allocation d'un tampon ; valeur élevée quand le pool est épuisé et que les E/S sont mises en file (« IO deferral mechanism »). Autres causes d'épuisement : NVRAM pleine ou foed lent à ingérer ; SAN lent et QoS v1 sont cités comme causes plus fréquentes. C'est la source la plus directe, et celle qui motive la réserve.","FASS_Module03_Performance_FR.docx (support vidéo FASS, module 03) — Slide « Pilote LIO et ps_bdrv : les étapes » (12:42), transcription de 12:39 à 13:38, p. 17 : Latence élevée dans la phase du pilote = E/S en file qui ne reçoivent pas assez vite de tampons ; deux causes : tempêtes d'E/S (thundering herd) ou charge qui pousse la baie au-delà de ses limites et remplit la NVRAM.","FASS_Module03_Performance_FR.docx (support vidéo FASS, module 03) — Points clés « 3. Analyser les étapes du pilote (alloc_stall, etc.) », p. 4-5 : Phases d'allocation de tampons : valeurs élevées = pénurie de tampons due à de très grosses E/S, à des tempêtes d'E/S ou à un arriéré causé par un goulot NVRAM/CPU. alloc_done_to_exec est une étape distincte (écarte A).","FlashArray Performance — Using Visual Perf Report to Further Your Investigation › Continue Research, p. 56 : Toujours vérifier que la baie se comporte normalement : une contre-pression venue d'autres zones comme la NVRAM peut se présenter comme une latence externe alors qu'elle est interne.","purity_fa_admin_guide_pdf_6122.pdf (Purity//FA Administration Guide 6.12.2) — Analysis › Performance › Understanding the Performance Charts, p. 329 : QoS Rate Limit Time est une métrique à part : temps passé en file à cause des limites de bande passante atteintes sur des volumes (écarte C)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 30,"c": "1.01","q": "A Support Specialist is preparing to evacuate a DirectFlash Shelf. Which step should they take before the evacuation starts?","o": ["Run evacuation health checks to identify issues and confirm resource availability.","Confirm shelf cabling is correct and no errors are present with sas_view.py.","Confirm both shelf IOMs appear online and healthy in purehw list."],"a": [0],"e": "La documentation sur l'évacuation de stockage le dit en encadré « Important », presque dans les mêmes mots que la réponse A : toujours lancer les contrôles de santé d'évacuation avant de démarrer, pour identifier les problèmes, s'assurer de la disponibilité des ressources et protéger les données. La checklist et le guide de démarrage rapide donnent la commande : fa health evac (par exemple fa health evac –shelf pour un shelf). B et C sont écartées : ni sas_view.py ni la vérification des IOM dans purehw list ne figurent dans la checklist d'évacuation. Ce sont des contrôles de câblage et de matériel utilisés à l'installation ou au dépannage d'un shelf, pas l'étape préalable exigée avant une évacuation.","s": ["FlashArray FlashArray Storage Shelves — FlashArray Storage Evacuation (encadré « Important »), p. 36 : « Always run evacuation health checks before starting an evacuation » : identifier les problèmes, garantir la disponibilité des ressources, protéger les données ; sauter ces contrôles expose à des pertes de données et à des reconstructions prolongées. C'est la source la plus directe.","FlashArray FlashArray Storage Shelves — FlashArray Storage Evacuation › FlashArray Storage Evacuation Checklist, étapes 1 à 7, p. 36-37 : Étape 3 : lancer un contrôle de santé d'évacuation avec fa health evac, avant de régler les tunables (étape 4) et de démarrer l'évacuation (étape 5). On peut évacuer des disques, des data packs et des shelves (châssis, SAS, DFS).","FlashArray FlashArray Storage Shelves — FlashArray Storage Evacuation › FlashArray Storage Evacuation Quick Start Guide, étape 2, p. 37-38 : Syntaxe : fa health evac avec –drive, –pack ou –shelf ; exemples pour un ou plusieurs shelves.","Support Toolkit — Listing All the Available 'fa' Support Tools › Answer (Command Map, branche « health »), p. 12 : fa health evac = contrôles préalables et simulation de l'évacuation de périphériques."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 31,"c": "5.03","q": "An ActiveDR replica link has rising lag because incoming writes exceed the available replication bandwidth for an extended period. What behavior should the Support Specialist expect from the replica link?","o": ["It immediately demotes the source pod to prevent additional writes.","It switches to synchronous replication and waits for target acknowledgment on each write.","It automatically transitions into periodic asynchronous replication mode."],"a": [2],"e": "La documentation ActiveDR décrit ce cas avec les mêmes termes que l'énoncé : si le débit d'écriture entrant dépasse la bande passante de réplication disponible pendant une période prolongée, ActiveDR passe en transferts périodiques. Il bascule automatiquement, en arrière-plan, du moteur à RPO quasi nul vers le moteur asynchrone, qui envoie des mises à jour périodiques à la cible ; une fois le problème réglé, il revient automatiquement au mode continu. A est écartée : rien dans ce comportement ne rétrograde le pod source. La promotion et la rétrogradation des pods sont des actions manuelles de l'administrateur, et le pod source continue de recevoir les écritures des hôtes. B est écartée : ActiveDR ne passe pas en synchrone. Le réseau de réplication n'est pas dans le chemin des E/S des hôtes, et la réplication synchrone avec acquittement sur les deux baies est le domaine d'ActiveCluster.","s": ["ActiveDR — Replication Network Bandwidth Requirements › Solution Performance Expectations (dernier paragraphe), p. 27 : Si le débit d'écriture dépasse la bande passante de réplication « for an extended period of time », ou si une des baies est surchargée, ActiveDR passe en transferts périodiques. C'est la source la plus directe.","ActiveDR — ActiveDR Operations › Normal Replication Operation, p. 37 : ActiveDR passe automatiquement, en arrière-plan, du moteur à RPO quasi nul au moteur asynchrone et envoie des mises à jour périodiques à la cible ; retour automatique au moteur quasi synchrone une fois le problème réglé.","ActiveDR — Replication Network Requirements, p. 23 : Bande passante insuffisante : le RPO augmente jusqu'au seuil de resynchronisation (20 minutes), puis passage au moteur de réplication périodique (resync) ; le réseau de réplication n'est pas dans le chemin des E/S des hôtes (écarte B).","ActiveDR — ActiveDR Performance FAQ › « When does ActiveDR transition between continuous replication mode and periodic transfer mode? », p. 16-17 : Passage du mode continu au mode de transfert périodique quand le RPO (lag) dépasse 20 minutes.","FASS_Module04_02_ActiveWorkload_ActiveDR_Offload_FR.docx (support vidéo FASS, module 04) — Tableau « Choisir la réplication : récapitulatif » ; slide sur le fonctionnement d'ActiveDR, p. 1 et p. 7-8 : ActiveDR = flux continu quasi synchrone, sans acquittement sur les deux baies avant de répondre à l'hôte ; ActiveCluster = synchrone."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 32,"c": "2.04","q": "A customer wants to start a Self-Service Upgrade (SSU) on a FlashArray running Purity//FA 6.2.9. What should the Support Specialist recommend?","o": ["Start the SSU because every Purity//FA 6.2.x release is eligible.","Edge services must be installed before beginning the SSU.","Use an assisted upgrade because SSU eligibility begins with Purity//FA 6.2.10."],"a": [2],"e": "Les prérequis SSU précisent que la baie doit tourner sous Purity 6.2.10 ou une version ultérieure avant la mise à jour, et que si elle est sur une version antérieure il faut demander une mise à jour assistée. La 6.2.9 est juste en dessous du seuil : la SSU n'est donc pas possible, il faut une mise à jour assistée par le support. A est écartée : toutes les 6.2.x ne sont pas éligibles, le seuil est la 6.2.10. B est le distracteur : les services Edge font bien partie des prérequis d'une SSU, mais Pure1 Edge Service exige lui-même au minimum Purity//FA 6.2.10 (ou 6.3.1). En 6.2.9, on ne peut donc pas régler le problème en installant les services Edge : une mise à niveau de Purity est d'abord nécessaire.","s": ["Pure1 Manage - Dashboard — Pure1 Manage - Software Lifecycle › Purity Upgrades › Self-Service Upgrades Prerequisites › SSU-Eligible Versions, p. 76-77 : La baie doit tourner sous Purity 6.2.10 ou ultérieur avant la mise à jour ; sur une version antérieure, « you will need to request an assisted upgrade ». C'est la source la plus directe.","Pure1 Manage - Troubleshooting — Pure1 Manage - Edge Service › About the Gateway and Agents › Understanding the Gateway Status (ligne « Purity upgrade required »), p. 64 : Pure1 Edge Service exige au minimum Purity//FA 6.2.10 ou 6.3.1 ; les versions antérieures nécessitent une mise à niveau de Purity, à planifier avec le support (écarte B).","FASS_Module05_Install_Upgrade_FR.docx (support vidéo FASS, module 05) — Slide « Prérequis pour utiliser la SSU » (19:23) et tableau « Prérequis de la SSU », p. 23 et p. 2 : Prérequis n° 2 : FlashArray sous Purity 6.2.10 ou supérieur.","Purity__FA Purity__FA Upgrades — Upgrade Reference › Self-Service Upgrade Checks › ligne EmsHealthCheck, p. 121 : Contrôle propre à la SSU, applicable aux mises à jour à partir de 6.2.10+ et 6.3.1+."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 33,"c": "5.04","q": "Which replication type(s) are supported by FlashArray File?","o": ["ActiveDR","ActiveCluster, ActiveDR, and Asynchronous Replication using pgroup","ActiveCluster"],"a": [0],"e": "La FAQ FA File répond aux deux questions : ActiveDR fonctionne avec les services de fichiers (à partir de Purity//FA 6.3.0), et ActiveCluster n'est pas pris en charge, les services de fichiers s'appuyant sur ActiveDR pour la réplication. La matrice de support confirme, pour toutes les versions listées : « ActiveDR File Replication » oui, « ActiveCluster File Replication » non, « Files in Protection Groups » non. B est écartée : la ligne « Files in Protection Groups » de la matrice est à « N » partout ; la réplication asynchrone par groupes de protection ne s'applique donc pas aux données fichier. C est écartée : même en tenant compte de la nouveauté 6.12.2, ActiveCluster ne serait pas le seul type pris en charge, puisque ActiveDR l'est depuis la 6.3.0.","s": ["FlashArray File ServicesFlashArray File Services — FAQ › « Does Asynchronous Replication (ActiveDR) work with FlashArray File Services? » et « Does ActiveCluster (synchronous replication) work with FlashArray File Services? », p. 19 : ActiveDR : oui, à partir de Purity//FA 6.3.0 sur les deux baies. ActiveCluster : non, « File Services rely on ActiveDR for replication ». C'est la source la plus directe.","FlashArray File ServicesFlashArray File Services — FlashArray File - Overview › FlashArray File - Support Matrix › Feature Support, p. 31-32 : Tableau par version : ActiveDR File Replication = Y ; ActiveCluster File Replication = N ; Files in Protection Groups = N (écarte B).","ActiveCluster — FAQ › « Can FA File be used for ActiveCluster replication? », p. 54 : Non : la réplication ActiveCluster de fichiers n'est prise en charge par aucune version de Purity (selon ce document).","ActiveDR — ActiveDR for File Services › « What purity release supports native file Replication with ActiveDR for file? », p. 17 : La réplication native de fichiers avec ActiveDR est disponible à partir de Purity 6.3.0.","FlashArray FlashArray Release Notes — Purity//FA 6.12 Release Notes › Purity//FA 6.12.2 Release Notes › Release Highlights et New Features, p. 7 : Nouveauté du 6 septembre 2026 : « ActiveCluster for File », réplication synchrone des services de fichiers en étirant un realm entre deux baies. C'est ce passage qui motive la réserve.","purity_fa_admin_guide_pdf_6122.pdf (Purity//FA Administration Guide 6.12.2) — FlashArray Concepts and Features › File Storage, p. 40-41 : ActiveDR est pris en charge pour les systèmes de fichiers ; ActiveCluster for File utilise des realms étirés et constitue un service distinct d'ActiveDR."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 34,"c": "2.02","q": "A Support Specialist needs to establish that both controllers are running the same version of Purity//FA from the CLI before beginning deeper troubleshooting. Which command should the Support Specialist run first?","o": ["purearray list –controller","purehw list –all","puresw list –version"],"a": [0],"e": "La procédure de health check commence par ce contrôle : « Purity Check -- Version -- Verify Versions Match », avec la commande purearray list –controller quand Purity tourne. Sa sortie donne une ligne par contrôleur (CT0, CT1) avec les colonnes Mode, Model, Version et Status : on voit d'un coup d'œil si les deux contrôleurs sont à la même version. B est écartée : purehw list –all liste les composants matériels et leur état (disques, ports, alimentations...), pas la version de Purity de chaque contrôleur. C est écartée : puresw gère les mises à jour logicielles ; puresw list affiche l'état d'une mise à jour, et la syntaxe du guide CLI ne prévoit pas d'option –version.","s": ["Purity__FA General Administration — Doing a Health Check on a FlashArray › Summarized Health Checks - Live CLI › Purity Check, p. 24 : « Version - Verify Versions Match » : purearray list –controller (Purity en fonctionnement), ou pureboot list sur les deux contrôleurs (Purity arrêté). C'est la source la plus directe.","m02-fasp-administration.pdf (support FASP, module 02) — Diapositive montrant la sortie de purearray list –controller, p. 45 : Exemple réel : CT0 et CT1 avec les colonnes Type, Mode, Model, Version (6.9.4 pour les deux), Status.","Purity__FA General Administration — Exemple de sortie de purearray list –controller, p. 216 : Autre exemple : CT0 primary et CT1 secondary, même version, statut ready.","purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › purearray › option –controller, p. 95 et p. 109 : Avec purearray list, –controller affiche pour chaque contrôleur le nom, le type, le mode, le modèle, la version de Purity//FA et le statut.","purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › puresw › Synopsis, p. 686 : puresw gère les mises à jour logicielles ; syntaxe : puresw list [–cli | –csv | –nvp] [–catalog], sans option –version (écarte C)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 35,"c": "5.02","q": "After a maintenance window where Purity//FA was upgraded, the arrays in an ActiveCluster pair are unable to reach the on-premises mediator, but can reach each other over the replication link. What should the Support Specialist investigate first?","o": ["Mediator connectivity on port 443","Mediator connectivity on port 80","Firewall settings on the mediator OVA"],"a": [1],"e": "Le médiateur on-premises est une machine virtuelle hébergée par le client, et ses prérequis indiquent que les baies doivent pouvoir y accéder sur le port 80. Le tableau des ports du FlashArray confirme : « On-Prem Mediator », port 80, TCP, en sortie depuis le port de gestion. Les baies se voyant toujours par le lien de réplication, le problème est isolé au chemin de gestion vers le médiateur : c'est donc cette connectivité sur le port 80 qu'il faut vérifier d'abord. A est le piège : le port 443 (HTTPS) concerne le médiateur cloud Pure1, qui passe par l'infrastructure phone home, pas le médiateur on-premises auquel les baies se connectent directement. C est écartée : le pare-feu interne de la VM du médiateur n'est pas un réglage sur lequel on intervient. Seul le port de « race » du médiateur est ouvert, aucun accès réseau d'administration n'existe, et le client ne peut pas modifier le système de la VM.","s": ["ActiveCluster — FlashArray ActiveCluster - Deployment › ActiveCluster On-Premises Mediator Deployment Guide › On-Premises Mediator Requirements, p. 135 : « Arrays must be able to access the mediator on port 80 ». C'est la source la plus directe.","FlashArray Connectivity — FlashArray Connectivity Reference › FlashArray TCP and UDP Port Assignments (tableau, ligne « On-Prem Mediator »), p. 15 : Port 80, TCP, sortant, depuis le port de gestion, si la VM du médiateur on-prem est en dehors du pare-feu local.","ActiveCluster — On-Premises Mediator FAQ (proxy ; mises à jour ; correctifs du système de la VM), p. 65-66 : Avec un médiateur on-premises, Purity se connecte directement au médiateur sans utiliser le proxy phone home. Seul le port de race est ouvert sur la VM, sans autre accès réseau (écarte C). Une version de Purity peut exiger un médiateur plus récent, annoncé dans les notes de version.","ActiveCluster — Management Network Firewall Changes (accès au médiateur Pure1), p. 40 : L'accès au médiateur Pure1 (cloud) demande un accès sortant sur le port 443 en HTTPS : c'est le port du médiateur cloud, pas du médiateur on-premises (écarte A).","Purity__FA Purity__FA Upgrades — Upgrade Script Release Notes (contrôle « PurityMediatorCompatibility »), p. 207 : Un contrôle de pré-mise à jour vérifie qu'un médiateur on-prem n'est pas trop ancien pour la version cible : point à examiner ensuite si la connectivité sur le port 80 est bonne."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 36,"c": "5.02","q": "Two FlashArrays in an ActiveCluster pair lose connectivity to the mediator. A few minutes later, the replication link between the arrays also fails. The pod has a failover preference configured, and Pre-Election completed before the link failure. Which array should the Support Specialist expect to remain online for the pod?","o": ["Neither array, because losing mediator connectivity prevents either array from remaining online.","Both arrays, because mediator connectivity was lost before the replication link failed.","The array selected during Pre-Election based on the configured pod failover preference."],"a": [2],"e": "C'est exactement le scénario pour lequel la pré-élection existe : quand les deux baies perdent le médiateur, Purity pré-élit une baie par pod ; si les baies perdent ensuite le contact entre elles, la baie pré-élue garde le pod en ligne et l'autre le met hors ligne. Le premier critère de choix de la baie pré-élue est la préférence de basculement du pod, quand elle est définie. Le tableau des scénarios de panne le résume ainsi : médiateur perdu, puis réseau de réplication perdu au moins 5 minutes plus tard, les volumes restent en ligne sur la baie déterminée par la préférence de basculement du pod. A est écartée : c'était le comportement d'avant la pré-élection. Depuis Purity 5.3, la perte du médiateur suivie de la perte du lien ne met plus le pod hors ligne des deux côtés. B est écartée : une seule baie est pré-élue par pod à un instant donné. Le pod reste hors ligne sur la baie non élue, ce qui évite le split-brain.","s": ["purity_fa_admin_guide_pdf_6122.pdf (Purity//FA Administration Guide 6.12.2) — Storage › Pods › Pod Mediator and Pre-election, p. 179-180 : Médiateur inaccessible des deux côtés : Purity pré-élit une baie par pod ; si les baies perdent ensuite le contact, la baie pré-élue garde le pod en ligne et l'autre le met hors ligne. Premier critère : si le pod a une préférence de basculement, la baie préférée est pré-élue. Une seule baie pré-élue par pod. C'est la source la plus directe.","ActiveCluster — ActiveCluster with VMware User Guide › Implementing vSphere Metro Storage Cluster With ActiveCluster: Failure Scenarios (tableau, dernière ligne), p. 262 : Médiateur en panne puis, 5 minutes ou plus après, réseau de réplication en panne : la pré-élection garde les volumes du pod étiré en ligne sur la baie « pre-determined by the pod failover preference ».","ActiveCluster — FAQ › « What is Pre-Election? » et « What does Pre-Election do? », p. 63-64 : Fonction qui s'engage automatiquement quand les deux baies perdent le médiateur, pour garder les volumes en ligne en cas de perte ultérieure des liens de réplication ; activée par défaut à partir de Purity 5.3.","ActiveCluster — Legacy Support: ActiveCluster › ActiveCluster Pre-Election Feature (note « Pre-Election Caveats »), p. 331 : La pré-élection n'est pas instantanée : elle dépend de l'intervalle d'interrogation du médiateur de 5 minutes ; la baie qui la remporte garde les volumes en ligne jusqu'à la reconnexion de l'autre.","purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › purepod › Pre-Election, p. 490-491 : purepod list –mediator affiche « (pre-elected) » à côté de la baie pré-élue.","m05-fasp-data-protection.pdf (support FASP, module 05) — Diapositive « ActiveCluster Options » (Failover Preference, Pre-Election), p. 52 : La pré-élection garantit que la baie pré-élue reste en ligne si le réseau de réplication tombe alors que le médiateur est indisponible ; la préférence de basculement est un réglage par pod."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 37,"c": "3.03","q": "A customer wants to create an S3 bucket on a FA//X90R5 running Purity//FA 6.10.5. An S3 compatible client is configured and can reach the FlashArray. Which command should the Support Specialist advise the customer to run next?","o": ["purebucket create –account <account-name> <bucket-name>","pureobj create –account <account-name> <bucket-name>","pures3 bucket create –account <account-name> <bucket-name>"],"a": [0],"e": "Le guide CLI consacre une commande aux buckets : purebucket, qui crée, gère et affiche les buckets. Sa syntaxe de création est purebucket create –account ACCOUNT NAME, et le guide précise que pour créer un bucket il faut indiquer le compte sous lequel il résidera. C'est exactement la forme de la réponse A. La configuration (FA//X R5, Purity//FA 6.10.5) est bien prise en charge : FlashArray Object est disponible à partir de la 6.10.5. B est écartée : pureobj existe, mais pour d'autres objets (pureobj account pour les comptes, pureobj secure-user, pureobj virtual-host). Il n'a pas de sous-commande « create » directe pour un bucket. C est écartée : aucune commande « pures3 » ne figure dans le guide CLI.","s": ["purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › purebucket › Synopsis et Description (création de buckets), p. 139-141 : purebucket crée, gère et affiche les buckets ; syntaxe : purebucket create –account ACCOUNT [–context REMOTE] NAME ; pour créer un bucket, il faut préciser le compte. C'est la source la plus directe.","purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › pureobj account, p. 387 : pureobj account crée, liste et supprime les comptes de l'Object Store (pureobj account create NAME) : c'est l'étape préalable, pas la création du bucket (écarte B).","FlashArray Object Services — FlashArray Object Services (présentation : étapes de mise en œuvre et prise en charge), p. 3-4 : Ordre des étapes : compte de stockage objet, utilisateurs et clés d'accès, puis bucket dans le compte. Pris en charge à partir de Purity//FA 6.10.5 sur //XL, //X, //C et //E, générations R4 et R5.","FlashArray Object Services — FlashArray Object Quick Start Guide › Step 3 - Setup a Bucket, p. 20-21 : Un bucket est le conteneur logique des objets ; à la création (ici par la GUI), on choisit le compte puis le nom du bucket."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 38,"c": "3.02","q": "When configuring a FlashArray in a Fibre Channel (FC) network, which configuration practice ensures optimal performance?","o": ["Use auto-negotiation to allow ports to adjust speeds as needed.","Ensure consistent port speeds across all switches in the FC fabric.","Connect 4Gb hosts directly to 16Gb FC ports to maximize throughput."],"a": [1],"e": "La documentation recommande de garder des vitesses de ports SAN cohérentes sur tout le chemin de l'initiateur, et d'isoler les vitesses FC les plus basses dans leur propre SAN (physiquement ou logiquement), pour éviter les équipements en slow drain et l'épuisement des crédits. Les vitesses FC mélangées figurent parmi les causes typiques de timeouts CTIO. C est le contre-exemple cité par la documentation elle-même : un initiateur 4 Gb connecté à un port cible 8 Gb ou 16 Gb devient un équipement en slow drain, capable de dégrader les performances de tous les équipements connectés. A est écartée : laisser les vitesses s'ajuster librement n'empêche pas les mélanges de vitesses, qui sont le problème. Quand l'écart est de deux crans (par exemple 8 Gb dans un SAN 16 Gb), la documentation conseille au contraire de fixer la vitesse des ports reliés à la baie un cran plus bas.","s": ["FlashArray Block Services — FlashArray Block - Troubleshooting › Diagnosing SAN Path › CTIO Timeouts Consistent to a Single Initiator, p. 230 : Vitesses FC mélangées = cause typique de timeouts CTIO ; un initiateur 4 Gb sur un port cible 8 ou 16 Gb est un « slow drain device » ; isoler les vitesses basses pour garder des vitesses de ports SAN « consistent across the entire initiator path ». C'est la source la plus directe.","FlashArray Block Services — FlashArray Block - Best Practices › SAN Guidelines for Maximizing Pure Performance › Port Connection Speeds (Fibre Channel, iSCSI), p. 20 : Un hôte 8 Gb relié à une baie 16 ou 32 Gb crée une contre-pression et des pertes de trames ; avec deux crans d'écart, fixer la vitesse des ports reliés à la baie un cran plus bas (écarte A).","FlashArray Block Services — FlashArray Block - Troubleshooting › Slow Drain › « What is Slow Drain? », p. 204 : Le slow drain peut se propager dans la fabric et ralentir du trafic sans rapport avec l'équipement fautif.","FASS_Module03_Performance_FR.docx (support vidéo FASS, module 03) — Tableau « Dépannage de la latence : checklist », ligne « Autres », p. 2 : Bonnes pratiques à vérifier : MPIO, mêmes vitesses de ports, jumbo frames de bout en bout."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 39,"c": "2.01","q": "Which user policy can manage fleet membership in Everpure Fusion?","o": ["Array_admin","Storage_admin","Ops_admin"],"a": [0],"e": "La FAQ Fusion répond directement : c'est le rôle Array Administrator (array_admin) qui a la permission de créer une flotte, d'en retirer des baies membres et d'y joindre des baies. La matrice RBAC des commandes Fusion le résume ainsi : les array_admin à portée baie ont accès à toutes les commandes purefleet, et seul un array_admin peut lancer purefleet create. B est écartée par la même matrice, en toutes lettres : les storage_admin ne peuvent pas gérer l'appartenance à la flotte. C est écartée : le guide d'administration cite un compte ops_admin (comme un compte readonly) parmi les comptes qui n'ont pas les privilèges suffisants pour faire rejoindre une flotte à une baie.","s": ["Everpure Fusion — FAQ › « Who has permissions to edit a fleet? », p. 9 : Le rôle Array Administrator (array_admin) peut créer une flotte, retirer des baies membres et joindre des baies à une flotte existante. C'est la source la plus directe.","Everpure Fusion — Everpure Fusion Commands RBAC Matrix (texte et « Summary »), p. 13 : Seul un array_admin peut lancer purefleet create ; les array_admin à portée baie ont accès à toutes les commandes purefleet ; « Storage_admins cannot manage fleet membership ».","Everpure Fusion Fusion Administration Guide — Preparing Active Directory for Directory Service › Mapping Security Policies to Groups, p. 7 : Pour créer des flottes, y ajouter ou en retirer des baies, l'utilisateur doit appartenir à un groupe LDAP associé à la politique « array_admin ».","purity_fa_admin_guide_pdf_6122.pdf (Purity//FA Administration Guide 6.12.2) — Fleet › erreurs lors de l'ajout d'une baie à une flotte, p. 444 : Un compte readonly ou ops_admin n'a pas les privilèges suffisants sur la cible pour rejoindre une flotte (écarte C).","FASS_Module02_Software_FR.docx (support vidéo FASS, module 02) — Slide de la matrice RBAC de la gestion de flotte, transcription à 44:27 ; tableau de synthèse « RBAC et fleet », p. 50 (tableau p. 5) : array_admin : toutes les commandes purefleet ; storage_admin : ne gère pas l'appartenance à la flotte."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 40,"c": "5.02","q": "Which command should a Support Specialist run to gather detailed pod events related to ActiveCluster replication on a FlashArray?","o": ["fa check pod","fa timeline pod","fa timeline ac"],"a": [2],"e": "Dans la liste des outils du Support Toolkit, la famille « timeline » regroupe les chronologies d'événements, et sa sous-commande « ac » est décrite comme les changements d'état de la réplication ActiveCluster. C'est donc fa timeline ac qui donne l'historique des événements des pods étirés. A et B sont écartées : la liste des outils ne contient pas de sous-commande « pod », ni sous « fa check » (firmware-versions, host-connectivity, io-balance, mce, repl-latency, shelf-cabling, snap-rpo), ni sous « fa timeline ». Les sous-commandes liées à ActiveCluster sont ac, mediator-status (timeline) et ac, ac-readiness (health).","s": ["Support Toolkit — FlashArray Support Toolkit › Listing All the Available 'fa' Support Tools › Answer (Command Map, branche « timeline »), p. 13 : timeline = chronologies d'événements et de statistiques ; ac = « Active Cluster replication status changes ». C'est la source la plus directe.","Support Tools — FlashArray CLI Tools › All Commands (ligne « fa timeline ac »), p. 13 : fa timeline ac : changements d'état de la réplication ActiveCluster ; ligne voisine : fa timeline activedr pour les événements ActiveDR.","Support Toolkit — Listing All the Available 'fa' Support Tools › Answer (Command Map, branches « check » et « health »), p. 12 : Aucune sous-commande « pod » sous check ; sous health : ac (santé ActiveCluster) et ac-readiness (écarte A).","Support Toolkit — Listing All the Available 'fa' Support Tools › Answer (suite de la branche « timeline »), p. 14 : Autres chronologies disponibles, dont mediator-status (changements d'état du médiateur ActiveCluster) ; pas de sous-commande « pod » (écarte B).","FASS_Module04_02_ActiveWorkload_ActiveDR_Offload_FR.docx (support vidéo FASS, module 04) — Slide des commandes de dépannage ActiveDR, p. 26-27 : Même logique pour ActiveDR : fa timeline activedr donne les événements de réplication sur une période."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 41,"c": "3.02","q": "A FlashArray//XCR5 and a host both use supported 32/64 Gb Fibre Channel (FC) adapters with the required firmware and driver stack. The customer wants encryption for the FC host session. What guidance should the Support Specialist provide to the customer?","o": ["The FC session can be transparently encrypted in hardware on a per-session basis.","The session requires changes to host multipathing before encryption can work.","The session is encrypted only if the replication connection uses Ethernet."],"a": [0],"e": "Les notes de version décrivent exactement ce cas : avec des adaptateurs FC 32/64 Gb compatibles côté hôte et côté baie (//XC R5) et la bonne pile firmware/pilote, les sessions FC sont chiffrées en matériel de façon transparente, sans rien changer au multipathing, aux systèmes de fichiers ni aux applications. Le chiffrement est négocié session par session. B est écartée : la source dit explicitement « sans changement du multipathing de l'hôte ». C est écartée : le chiffrement de la session hôte FC ne dépend pas du transport de réplication ; il dépend uniquement des HBA, du firmware/pilote et de la version de Purity (aucun support particulier du switch FC n'est requis).","s": ["FlashArray FlashArray Release Notes — Hardware-Based Encryption for Fibre Channel Sessions, p. 40-41 : Adaptateurs FC 32/64 Gb sur //XCR5 : sessions chiffrées en matériel de façon transparente, sans changement du multipathing ; négociation par session, repli en clair si un côté ne le supporte pas.","FlashArray Block Services — FlashArray Block - Deployment › Fibre Channel Encryption (Hardware / Software Requirements), p. 93-94 : Chiffrement matériel en transit ; HBA SecureHBA côté hôte ; //XL R5 puis //XC R5 depuis Purity 6.10.6 ; firmware et pilote compatibles ; aucun support requis du switch FC."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 42,"c": "1.03","q": "A Support Specialist is replacing drives one by one due to drive wear. Which command should the Support Specialist run to ensure all drives are healthy while maintaining data integrity and redundancy during drive replacement?","o": ["puredrive list","puredb list drives","find_drive.py"],"a": [1],"e": "Remplacer des disques un par un impose d'attendre, entre deux disques, que la parité soit entièrement reconstruite. puredb list drives liste chaque module avec son état et la colonne « Degraded » : tant qu'elle n'est pas à zéro partout, la redondance n'est pas rétablie. La documentation matérielle demande précisément d'exécuter puredb list drives et de vérifier que la colonne « degraded » ne contient que des zéros. A est écartée : puredrive list montre l'état des disques, mais la documentation prévient que cette sortie peut afficher une parité à 100 % alors qu'un élément est dégradé, et la colonne Degraded en a été retirée. C est écartée : find_drive.py sert à identifier les disques (nœud, produit, révision firmware, numéro de série, emplacement), pas à vérifier la santé ni la parité.","s": ["General FlashArray Hardware Reference — Swapping Drives Within a FlashArray › Solution (étape b), p. 209 : « Run puredb list drives and make sure that the degraded column contains only zeroes ». Exemple de sortie p. 39 (colonnes Status, Degraded, Last Failure).","Dark Site Support — FlashArray On-Premises Dark Site Health Checks › Execution › Option #1 - On Box (Drive Checks / Space), p. 104 : puredb list drives –space : détail par module, surcoût de parité et « degraded » pour suivre la reconstruction de parité. Le même tableau cite puredrive list et find_drive.py comme contrôles de disques.","FlashArray__X — FlashArray//X Troubleshooting › Controller Fails to Identify Drive on FlashArray//X (note), p. 432 : Vérifier avec « puredb list drives » qu'aucune reconstruction de parité n'est en cours avant d'agir sur un autre disque.","General FlashArray Hardware Reference — NVRAM Firmware Won't Upgrade, or Takes a Long Time › Solution (mise en garde), p. 192 : Ne pas se fier à puredrive list ou purearray list –space qui peuvent montrer une parité à 100 % malgré un élément dégradé."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 43,"c": "3.03","q": "A customer enables FlashArray File Services, but only one management interface is configured and cabled. Which requirement is not being met?","o": ["FlashArray File needs one management interface on the primary controller only as long as the virtual IP is reachable.","FlashArray File needs two management interfaces total: one on each controller. Each interface must be configured, enabled, and have an active link.","FlashArray File needs four Fibre Channel target ports dedicated to file clients before any management interfaces are required."],"a": [1],"e": "La FAQ FlashArray File indique le minimum réseau : au moins deux interfaces de management, une par contrôleur, configurées sur les deux contrôleurs et avec un lien actif. Avec une seule interface câblée, c'est cette exigence qui n'est pas remplie. A est écartée : c'est justement la situation fautive (une seule interface). C est écartée : les services de fichiers (SMB/NFS) passent par des interfaces Ethernet et des VIF de fichiers, pas par des ports Fibre Channel.","s": ["FlashArray File ServicesFlashArray File Services — FlashArray File - Troubleshooting › FlashArray File Performance FAQ › question 1 « What are the minimum network interfaces required for FA File? », p. 517 : Minimum de deux interfaces de management, une par contrôleur, configurées sur les deux contrôleurs avec des liens actifs ; même redondance recommandée pour les VIF de fichiers.","FlashArray Performance — FlashArray File Performance FAQ (même texte), p. 76 : Même recommandation : deux interfaces de management, une par contrôleur."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 44,"c": "1.03","q": "An onsite replacement request lists an 80- part number for a failed DirectFlash Module. Which information should the Support Specialist validate before dispatching the replacement?","o": ["The 83- FRU part number and the DFM capacity","The 83- FRU part number and the minimum Purity//FA version that supports it","The 80- assembly part number and the minimum Purity//FA version that supports it"],"a": [1],"e": "L'article « Minimum Purity//FA Levels for Drives » pose deux règles : pour dépanner et remplacer un DirectFlash Module, c'est la référence en 83- qui est exigée, car tous les types de DFM ne sont pas compatibles entre eux ; et chaque génération de disque exige une version minimale de Purity//FA. Il faut donc valider la référence 83- et le niveau de Purity de la baie. A est écartée : la capacité seule ne garantit pas la compatibilité (plusieurs DFM de même capacité ont des références et des versions minimales différentes). C est écartée : la référence 80- ne suffit pas, c'est la 83- qui est requise.","s": ["FlashArray DirectFlash Modules — Minimum Purity//FA Levels for Drives (note d'introduction), p. 4 : « When troubleshooting and replacing DirectFlash Modules, the 83- part number is required... because not all DirectFlash Module types are compatible » ; de nouvelles générations de disques exigent des mises à jour de Purity//FA.","FlashArray DirectFlash Modules — Minimum Purity//FA Levels for Drives (tableau Drive / Minimum Purity Level / Product ID), p. 5-6 et suivantes : Pour chaque référence FRU (83-xxxx-XX), la version minimale de Purity//FA requise.","FlashArray__X — Expédition de DFM (rappel), p. 224 : Selon le DFM expédié, respecter le « Minimum Purity Level for Drives » et être à la version Purity//FA indiquée ou au-dessus."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 45,"c": "4.04","q": "A host has a 300 MB/s limit, its host group has a 1 GB/s limit, and the volumes accessed by the host have a 200 MB/s limit. What bandwidth is available to this host?","o": ["200 MB/s","100 MB/s","300 MB/s"],"a": [0],"e": "Quand des plafonds QoS existent à la fois sur l'hôte / le groupe d'hôtes et sur le volume / le groupe de volumes, Purity applique toujours la limite la plus stricte : le débit effectif est borné par la plus petite limite configurée. Ici min(300 Mo/s, 1 Go/s, 200 Mo/s) = 200 Mo/s. B est écartée : les limites ne se soustraient pas (300 − 200). C est écartée : la limite de l'hôte n'est pas la plus basse, celle des volumes (200 Mo/s) s'applique avant.","s": ["FlashArray Block Services — Introduction to Block Storage › FAQs - QoS Rate Limits for Host/Hosts Group (note « Consistent with existing QoS »), p. 9 : Quand des limites hôte / groupe d'hôtes et volume / groupe de volumes sont définies, Purity applique toujours la limite la plus stricte (plafonds hôte et groupe d'hôtes ajoutés en Purity//FA 6.10.3).","FlashArray Block Services — FAQs - QoS Rate Limits for Host/Hosts Group (tableau Host/Host Group vs Volume/Volume Group, ligne « Key implementation notes »), p. 12 : « stricter (lower) ceiling wins for that IO path » ; le débit effectif est borné par la plus petite limite configurée.","FASS_Module03_Performance_FR.docx (vidéo) — QoS Rate Limiting (slide « Qu'est-ce que la QoS ? »), p. 37 : QoS rate limiting : configurable par l'utilisateur, en IOPS ou en bande passante (Mo/s)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 46,"c": "3.02","q": "A FlashArray host reports rising write latency on one Fibre Channel path. An alert record [lecture incertaine] points to CTIO timeouts on that path. What cause should the Support Specialist investigate?","o": ["Fibre Channel slow drain or related path congestion affecting frame delivery","Elevated array service time caused by backend processing rather than frame-delivery delays","Host-side queue saturation that is increasing queue time"],"a": [0],"e": "Un timeout CTIO est un problème de communication entre l'initiateur et le port FC de la baie : il signale un problème dans le SAN Fibre Channel (perte de trames, erreurs de transport, crédits). Limité à un seul chemin, il oriente vers ce chemin : congestion ou slow drain (crédits buffer-to-buffer épuisés), SFP ou câble. B est écartée : le timeout CTIO naît avant le traitement interne, quand les données de l'écriture n'arrivent pas à la baie ; ce n'est pas du temps de service. C est écartée : une file saturée côté hôte toucherait tous les chemins de l'hôte et ne génère pas de timeout CTIO sur un port de la baie.","s": ["Purity__FA Alerts — Alert 5002 - CTIO Timeout › Impact, p. 322 : Les timeouts CTIO indiquent des problèmes dans le SAN Fibre Channel entre l'initiateur et le port FC de la baie (perte de paquets, erreurs de transport) ; ils provoquent de fortes latences.","FlashArray Block Services — FlashArray Block - Troubleshooting › Diagnosing SAN Path (« Scenarios to help diagnose the most common CTIO Timeout issues »), p. 229 : Timeouts CTIO sur un seul port FC de la baie : examiner le chemin entre ce port et le switch ; sur un seul initiateur : examiner la liaison initiateur-switch.","FlashArray Block Services — FlashArray Block - Troubleshooting › Slow Drain, p. 204-205 : Slow drain : équipement qui n'acquitte pas les trames FC assez vite ; lié au contrôle de flux buffer-to-buffer ; peut ralentir tout le fabric."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 47,"c": "1.03","q": "During a new FlashArray//X50R5 installation with a Gen 2 chassis, a technician reports that there are no dedicated NVRAM modules. What should the Support Specialist conclude?","o": ["The dedicated NVRAM is only available on the FA//X70R5 and FA//X90R5.","The chassis is missing the NVRAM modules and will be shipped separately.","The chassis is using distributed NVRAM on the DirectFlash Modules."],"a": [2],"e": "Les //XR5 neufs sont livrés avec le châssis Gen 2, qui n'a pas d'emplacements pour des NVRAM dédiées : la fonction NVRAM est assurée par les DFMD (DirectFlash Modules with Distributed NVRAM). Les anciens emplacements NVRAM sont convertis en emplacements de DFMD, d'où 28 modules possibles. A est écartée : le châssis Gen 2 concerne tous les modèles //XR5 livrés neufs, pas seulement certains. B est écartée : rien ne manque, c'est l'architecture normale du châssis Gen 2.","s": ["FlashArray__X — FAQ FlashArray//XR5 › « What type of storage media is supported in FlashArray//XR5? », p. 31 : Les XR5 neufs sont livrés avec le châssis Gen2, sans emplacements distincts pour des modules NVRAM dédiés ; ils utilisent des DFMD (NVRAM distribuée).","FASS_Module01_Hardware_FR.docx (vidéo) — Châssis Gen2 de la FlashArray//XCR (slides à 35:41 et 36:40), p. 23-24 : Avec le châssis Gen 2, les NVRAM dédiées sont supprimées ; modules DirectFlash à NVRAM distribuée ; les slots NVRAM sont convertis pour accueillir des DFMD supplémentaires (jusqu'à 28).","FlashArray__X — FAQ FlashArray//XR5 › « Will R5 controllers be supported in the new Chassis Gen2? », p. 35 : Toutes les installations neuves de //XR5 sont livrées avec le châssis Gen2."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 48,"c": "2.01","q": "A storage administrator creates a Fusion preset at fleet scope and later adds another array to the fleet. What behavior should the Support Specialist expect?","o": ["The new array must be manually added to the existing preset.","The preset remains tied to the arrays that existed when it was created.","The fleet-scoped preset can be shared and synchronized to the newly added array."],"a": [2],"e": "Les objets créés dans le contexte de la flotte sont partagés avec toutes les baies de la flotte, y compris celles ajoutées après la création et le partage de l'objet. La synchronisation des presets est automatique, du coordinateur vers toutes les autres baies. A est écartée : la synchronisation est automatique, aucune action manuelle. B est écartée : le guide précise que le partage inclut les baies ajoutées plus tard.","s": ["purity_fa_admin_guide_pdf_6122 — Storage › Presets, p. 128 : Les objets créés dans le contexte « fleet » sont partagés avec toutes les baies de la flotte, y compris celles ajoutées après la création et le partage de l'objet.","m02-fasp-administration — Slide « The Fleet Coordinator » (Preset Synchronization), p. 39 : Synchronisation des presets : du coordinateur vers toutes les autres baies, automatique ; création possible depuis n'importe quelle baie."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 49,"c": "4.03","q": "Which FlashArray command should a Support Specialist run to view the back-end space categories?","o": ["fa timeline space –detailed","fa timeline space –used","fa timeline space –unreported"],"a": [2],"e": "L'aide de fa timeline space ne propose que deux options propres à l'outil : –used (catégories « Used Space ») et –unreported (catégories « Unreported Space »). Or le manuel ASP emploie « Back End Space » et « Unreported Space » comme synonymes (titre « Back End/Unreported Space » : RAID-HA, Reclaimable, Unknown). C'est donc –unreported qui affiche les catégories back-end. A est écartée : –detailed n'existe pas dans l'aide de l'outil. B est écartée : –used affiche les catégories d'espace utilisé (front-end), pas le back-end.","s": ["Support Toolkit — FlashArray Support Toolkit › étape 4 (sortie de « fa timeline space -h »), p. 19 : tool specific : –used = Display \"Used Space\" categories ; –unreported = Display \"Unreported Space\" categories.","Authorized Support Partner (ASP) Handbook — Space Concepts and Analysis › Introduction to Space › Overview of Space › Back End/Unreported Space, p. 72-73 : Back End = Unreported Space : catégories RAID-HA, Reclaimable et Unknown ; pas de représentation dans la GUI.","Dark Site Support — Tableau des commandes › Space and Dedup (Support Toolkit), p. 109 : fa timeline space et fa timeline space –used –unreported."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 50,"c": "4.04","q": "A customer reports that throughput for a workload does not increase in line with application demand, even though the array has available resources. The Support Specialist identifies a QoS setting on the workload. How should they interpret this finding?","o": ["The QoS setting limits the bandwidth available to the workload.","The QoS setting reserves array bandwidth exclusively for the workload.","The QoS setting dynamically increases the bandwidth available to competing workloads, but only when the option is selected."],"a": [0],"e": "Un débit qui plafonne alors que la baie n'est pas saturée est la signature d'une limite QoS (rate limiting) : un plafond en IOPS ou en bande passante configuré par l'utilisateur. Tant que la charge est sous le plafond elle tourne librement ; une fois le plafond atteint, la baie ralentit ses E/S. B est écartée : les plafonds QoS sont des limites hautes uniquement, sans garantie ni réservation. C est écartée : la limite ne redistribue rien aux autres charges, elle plafonne celle sur laquelle elle est posée.","s": ["FASS_Module03_Performance_FR.docx (vidéo) — Qualité de service › slide « Qu'est-ce que la QoS ? » (QoS Rate Limiting) et tableau de synthèse, p. 37 : QoS rate limiting : configurable par l'utilisateur sur des volumes ou groupes de volumes, limites en IOPS ou en bande passante ; plafonne la bande passante.","FlashArray Block Services — FAQs - QoS Rate Limits for Host/Hosts Group › « What is QoS ceiling for host and host group? », p. 9 : Les plafonds QoS sont des limites hautes uniquement (pas de garantie) ; sous le plafond la charge tourne librement, au plafond la baie ralentit ses E/S."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 51,"c": "2.02","q": "A customer reports a brief host I/O interruption during a controller event. A log review shows the primary controller gave back ownership and the peer took over. What most likely caused this failover?","o": ["The management port on the primary controller has failed.","The primary loses connectivity to one host path while backend quorum remains healthy.","The primary controller can no longer maintain quorum to backend devices."],"a": [2],"e": "Le modèle HA de la FlashArray est résumé ainsi : un contrôleur primaire abandonne sa revendication sur les périphériques (il entre en Giveback) s'il est jugé non sain, c'est-à-dire si une E/S est retardée ou bloquée, ou s'il ne peut plus maintenir le quorum (la connectivité aux périphériques dont il dépend pour servir les E/S). Le secondaire lance alors un takeover. La séquence « giveback puis takeover » des journaux correspond donc à une perte de quorum back-end. A est écartée : le port de management ne sert pas les E/S et n'entre pas dans le quorum (NVRAM / disques). B est écartée : la perte d'un chemin hôte se gère par le multipathing ; tant que le quorum back-end est sain, le primaire reste primaire.","s": ["Purity__FA General Administration — FlashArray HA Failover › HA Failover Explained, p. 54 : Le primaire entre en Giveback s'il est jugé non sain (E/S retardée ou bloquée) ou s'il ne peut pas maintenir le quorum ; le secondaire entame un takeover s'il détecte que le primaire ne détient plus le quorum.","Purity__FA General Administration — FlashArray HA Failover › Key Terminology, p. 53 : Définitions : Giveback, Takeover, Quorum (contrôle d'assez de périphériques NVRAM / disques pour servir les E/S et rester primaire).","Purity__FA General Administration — FlashArray HA Failover › Primary Crash or Quorum Loss, p. 56 : Scénario « crash du primaire ou perte de quorum »."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 52,"c": "4.03","q": "A customer has a FlashArray running Purity//FA 6.11.3 and the array GUI reports 77% capacity. After deploying a new database with consistent moderate write activity, the array reports an increase in system space over the following days [fin de phrase incertaine]. How should the Support Specialist interpret the increase in system space?","o": ["The array is reporting internal overhead that may indicate increasing capacity risk.","Snapshot space has increased because of the new database workload.","Space is pinned because the datapacks contain different flash module types."],"a": [0],"e": "L'espace système est l'espace qui dépasse le budget interne de la baie pour trois catégories : surcharge RAID/parité, espace récupérable (reclaimable) et espace nouvellement écrit non encore attribué. Des réécritures régulières (base de données) créent de l'espace à récupérer ; si la récupération ne suit pas, le budget est dépassé et l'espace système apparaît dans la GUI. C'est une surcharge interne, et un signal d'alerte précoce : à 100 % (volumes + partagé + snapshots + système) Purity commence à ralentir les écritures. B est écartée : les snapshots ont leur propre catégorie d'espace (Snapshots), distincte de System. C est écartée : rien dans l'énoncé n'indique des modules de types différents, et l'espace « pinned » n'est pas une cause de l'espace système dans la documentation.","s": ["FlashArray Space — Space Reference › System Space Explained, p. 4 : System space = dépassement du budget interne (RAID/parité, reclaimable, nouvellement écrit non attribué) ; l'espace réécrit doit être récupéré plus tard ; à 100 % Purity introduit du write throttling.","Purity__FA Alerts — Alert 25 - Storage Consumption has Reached X% of Usable Capacity › « Investigate System Space Growth », p. 42 : L'espace système reflète la surcharge interne ; il peut augmenter avec des charges à forte réécriture ; s'il persiste, ouvrir un dossier ; plus probable quand la baie approche 100 %.","FASS_Module03_Performance_FR.docx (vidéo) — Slide « SSD Mapped et impact sur les performances », p. 30 : System Space dans la GUI : alerte précoce, demande une attention urgente pour éviter un état de baie pleine."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 53,"c": "1.03","q": "During a new FlashArray//XR5 Gen 2 installation, the customer asks to add a SAS expansion shelf. What action should the Support Specialist take?","o": ["Gen 2 supports all prior media types; proceed with the shelf addition.","Add a supported SAS card and proceed with the installation.","Explain that SAS drives and shelves are not supported on the Gen 2 fresh install configuration."],"a": [2],"e": "La FAQ matérielle //XR5 est explicite : les nouveaux systèmes //XR5 ne prennent pas en charge les médias et shelves SAS ; les disques et shelves SAS ne sont PAS pris en charge avec le châssis Gen 2. Seuls les shelves DirectFlash (DFS Gen1 et Gen2) le sont. A est écartée : le Gen 2 ne reprend pas le SAS. B est écartée : la carte HBA SAS 12 Gb n'est pas prise en charge sur un //XR5 neuf ; elle n'existe que pour les mises à niveau matérielles sans interruption (HW-NDU) qui apportent des shelves SAS existants, en châssis Gen 1.","s": ["FlashArray__X — FlashArray//XR5 Hardware FAQ › « What type of Shelves are supported with FlashArray//XR5 Chassis Gen2? », p. 36 : DFS Gen1 et Gen2 pris en charge ; disques et shelves SAS NON pris en charge avec le châssis Gen2.","FlashArray__X — FlashArray//XR5 Hardware FAQ › « Does FlashArray//XR5 support mixed media types in the controller chassis? », p. 32 : Les nouveaux //XR5 ne prennent pas en charge les médias et shelves SAS ; pas de disques SAS dans le châssis Gen 2.","FlashArray__X — FlashArray//XR5 Hardware FAQ › « How are the SAS shelves connected to FlashArray//XR5? » et note sur le HBA SAS, p. 33 et 46 : SAS uniquement pour les clients venant d'une NDU ; impossible d'ajouter un shelf SAS à un système neuf (green field).","FASS_Module01_Hardware_FR.docx (vidéo) — Châssis Gen2 de la FlashArray//XCR, p. 23-24 : Châssis Gen 2 : uniquement des modules DirectFlash (DFM / DFMD), jusqu'à 28."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 54,"c": "2.01","q": "While investigating the cause of an array being down, a Support Specialist finds the following log entry: segmap.ss_mapper.main ss map no usable write groups, giving up [transcription approximative] What action can help resolve this issue?","o": ["Add available drive packs to empty slots to increase capacity.","Wait for controller failover to complete, then check if I/O is returning on both controllers.","Check if the user has write permissions to the file and is assigned to the correct group."],"a": [0],"e": "Le message indique que Purity ne trouve plus aucun write group dans lequel écrire. Un write group est l'ensemble de disques sur lequel Purity écrit ses segments (6 données + 2 parité) ; s'il n'en reste aucun d'utilisable, la baie ne peut plus écrire et s'arrête. La seule des trois actions qui redonne des write groups utilisables est d'ajouter de la capacité (packs de disques) ; c'est aussi l'action suggérée par l'alerte de capacité (ajouter un shelf ou de la capacité). B est écartée : un basculement ne change rien, les deux contrôleurs partagent les mêmes disques et les mêmes write groups. C est écartée : « write group » n'a rien à voir avec un groupe d'utilisateurs ni avec des permissions de fichier ; c'est un piège de vocabulaire.","s": ["FASS_Module02_Software_FR.docx (vidéo) — Synthèse « Write groups et garbage collection » ; slide « Quand l'E/S arrive, Purity choisit le write group de destination », p. 2 et 30 : Quand une E/S arrive, Purity choisit le write group de destination du segment ; tous les disques d'un write group ont la même taille (définition du write group, pas du message).","Purity__FA Alerts — Alert 25 - Storage Consumption has Reached X% of Usable Capacity (Suggested Action), p. 38-39 : Action suggérée quand la baie se remplit : augmenter la capacité en ajoutant un shelf de stockage ou une baie.","FlashArray Space — Space Reference › System Space Explained, p. 4 : À 100 % de remplissage Purity bride les écritures ; il ne faut pas remplir la baie au-delà de la capacité disponible."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 55,"c": "4.04","q": "Two workloads share array resources, and both experience changes in performance when demand increases. What should the Support Specialist explain about QoS fairness?","o": ["QoS fairness prioritizes whichever workload begins consuming array resources first.","QoS fairness provides each workload with an equal amount of available performance.","QoS fairness helps determine how performance is shared between workloads when resources are contended."],"a": [2],"e": "La QoS fairness est un mécanisme toujours actif, à l'échelle de la baie, géré par Purity. Il n'intervient que lorsque la baie est en contention : il limite les E/S servies simultanément, met des E/S en file et reprend en priorité le volume qui a fait le moins de travail récemment. Il décide donc comment la performance est répartie entre les charges quand les ressources sont disputées. A est écartée : la reprise se fait selon l'utilisation récente (le moins servi d'abord), pas « premier arrivé ». B est écartée : il n'y a pas de part égale garantie ; le volume bruyant a simplement plus d'E/S en file, et hors contention la fairness ne limite rien.","s": ["FASS_Module03_Performance_FR.docx (vidéo) — Slide « Comment ça marche ? (QoS Fairness) » et commentaire à 46:52, p. 38 : Limite des E/S servies en même temps ; baie contendue : files QoS ; reprise des E/S suspendues selon l'utilisation récente (le volume qui a fait le moins de travail) ; isolation du noisy neighbor.","FASS_Module03_Performance_FR.docx (vidéo) — Slide « Qu'est-ce que la QoS ? » (QoS Fairness, toujours active), p. 37 : Mécanisme à l'échelle de la baie, toujours actif, non configurable, qui empêche la baie d'être submergée.","FlashArray Performance — Troubleshooting › Performance Troubleshooting › Using Visual Perf Report (paragraphe sur QoS v1), p. 58 : QoS v1 (fairness) : bride les E/S volume par volume quand les temps de service internes dépassent les seuils, en suspendant les E/S des volumes les plus chargés."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 56,"c": "5.04","q": "A Support Specialist is working on a FlashArray File performance issue. What command should the Support Specialist run to investigate FlashArray File performance stats?","o": ["fa timeline file-perf","fa timeline array-perf","fa timeline perf"],"a": [0],"e": "fa timeline file-perf est l'outil du Support Toolkit dédié aux métriques de performance de la passerelle de fichiers (filegw) et de l'object store ; il lit core.log et filegw.log et propose des rapports filegw, cpu, counter, os et medium. B est écartée : fa timeline array-perf donne les statistiques de performance de la baie entière. C est écartée : fa timeline perf donne les statistiques générales de performance. Aucune des deux n'est spécifique aux services de fichiers.","s": ["Support Tools — FlashArray CLI Tools › fa timeline file-perf (Summary, Data Sources, How to Use), p. 25-26 : Fournit les métriques de performance de la file gateway et de l'object store ; sources core.log et filegw.log ; exemples « fa timeline file-perf -s ... -e ... ».","Support Tools — FlashArray CLI Tools › All Commands, p. 14 : file-perf : métriques des sous-systèmes fichier ou object store ; perf : statistiques générales ; array-perf : statistiques de performance de la baie."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 57,"c": "2.02","q": "Which command will display write group and drive header details live on the array?","o": ["puredrive list –pack","lsapt [lecture incertaine]","find_drive.py all"],"a": [1],"e": "lsapt liste l'identifiant d'appartement (apartment ID) et l'identifiant de write group de chaque module de la baie : ces informations sont lues dans l'en-tête de chaque disque. La documentation l'utilise en direct sur la baie (prompt root) pour vérifier qu'il n'y a qu'un seul apartment ID, pour repérer des périphériques « stunned », et elle relie lsapt à l'état des en-têtes de disque. A est écartée : puredrive list –pack montre la répartition des disques par pack / write group, pas les en-têtes. C est écartée : find_drive.py all identifie les disques (nœud, produit, révision firmware, numéro de série, emplacement), sans notion de write group.","s": ["Dark Site Support — FlashArray On-Premises Dark Site Health Checks › Execution › Option #1 - On Box (ligne « lsapt ») ; rappel dans Support Toolkit Info Sheet, p. 104 et 128 : lsapt : liste l'apartment ID et le write group ID de chaque module de la baie ; vérifier un seul apartment ID.","General FlashArray Hardware Reference — Réadmission de disques « unrecognized » (dernière étape de la procédure), p. 55 : Quand tous les disques sont sains dans puredrive list et lsapt, les en-têtes de disque (drive headers) ont été effacés et les disques admis dans Purity.","FlashArray FlashArray Storage Shelves — Guidelines de réutilisation d'un shelf (paragraphe « Embiggening ») ; Shelf Troubleshooting › NVRAM is Stunned During NDU, p. 82 et 91-93 : Commandes liées aux write groups : lsapt et puredrive list –pack ; exemple de sortie de lsapt sur la baie.","FlashArray FlashArray Storage Shelves — Exemple « find_drive.py all », p. 8 : Sortie de find_drive.py all : Drive, Nodes, Product, Rev, SN, Expander, Enclosure, Slot (pas de write group)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 58,"c": "3.04","q": "When configuring Multi-Factor Authentication (MFA) for a FlashArray using SAML2, what is the role of the Verification Certificate in the setup process?","o": ["It encrypts the communication channel between the user and the FlashArray.","It ensures secure communication between the Identity Provider (IdP) and the FlashArray.","It verifies the identity of the user during login."],"a": [1],"e": "Le Verification Certificate est le certificat X.509 (PEM) fourni par l'IdP (son certificat de signature de jetons, « Token-signing ») que l'on colle dans la section Identity Provider de la configuration SAML2 de la baie. Il sert à la baie (Service Provider) pour vérifier que les assertions SAML viennent bien de l'IdP de confiance : il sécurise donc l'échange entre l'IdP et le FlashArray. A est écartée : le canal utilisateur ↔ baie est chiffré par TLS (HTTPS), sans rapport avec ce certificat. C est écartée : c'est l'IdP qui vérifie l'identité de l'utilisateur (mot de passe, second facteur) ; la baie ne fait que valider la réponse de l'IdP.","s": ["purity_fa_admin_guide_pdf_6122 — Settings › Access › Configuring SAML2 SSO (étape 5, champs Identity Provider), p. 422 : Relation de confiance entre la baie (SP) et l'IdP ; « Verification Certificate : coller le certificat X.509 au format PEM de votre IdP ».","Purity_FA_Admin_Guide_PDF_6104 — Dépannage SAML2 SSO (étape 6), p. 407 : Vérifier que le certificat « Token-signing (verification certificate) » de l'IdP n'a pas expiré.","FlashArray Security — Identity and Access Management › Single Sign-On (SSO) with SAML 2.0, p. 102-107 : SAML2 échange les informations d'identité et d'authentification entre l'IdP et le Service Provider ; sans Metadata URL, il faut saisir tous les champs IdP, dont le Verification Certificate.","Working with Single Sign-On (SSO) — Champs de configuration de l'IdP (Pure1, même principe SAML), p. 58 : Certificate : certificat public de signature de l'IdP, utilisé pour valider l'assertion reçue de l'IdP."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 59,"c": "3.04","q": "After enabling SAML2 SSO, all SAML users are locked out of the FlashArray GUI. What step should the Support Specialist take to troubleshoot this issue?","o": ["Use the array's IP address instead of FQDN, as SAML2 SSO does NOT support FQDN.","Verify that the group-to-role mapping includes the Storage Replica Administrators role.","Log in using the Local Access link in the GUI, then rerun the end-to-end (E2E) test to identify the issue."],"a": [2],"e": "Le guide d'administration prévient : n'activer SAML2 SSO que si le test de bout en bout réussit ; activé avec une configuration invalide, tous les utilisateurs SAML sont bloqués hors de la GUI. Dans ce cas, un administrateur de la baie (par exemple pureuser) garde un accès de secours par le lien « Local Access » de la page de connexion ; il peut alors relancer le test de bout en bout, qui indique ce qui échoue. A est écartée : c'est l'inverse, le champ Array URL doit contenir l'URL exacte (FQDN) utilisée pour accéder à la GUI. B est écartée : un rôle manquant ne bloquerait pas tous les utilisateurs SAML ; le blocage général signale une configuration SSO invalide.","s": ["purity_fa_admin_guide_pdf_6122 — Settings › Access › Testing SAML2 SSO (CAUTION), p. 423 : N'activer SAML2 SSO que si le test de bout en bout réussit ; sinon tous les utilisateurs SAML sont bloqués hors de la GUI Purity//FA.","purity_fa_admin_guide_pdf_6122 — Settings › Access › SAML2 SSO (note sous « Limitations and Considerations »), p. 421 : Si le service SAML2 SSO est indisponible ou mal configuré, un administrateur (pureuser) accède à la baie par le lien Local Access de la page de connexion : accès de secours.","purity_fa_admin_guide_pdf_6122 — Settings › Access › Configuring SAML2 SSO (champ Array URL), p. 422 : Array URL : l'URL exacte d'accès à la GUI, par exemple https://myarray.mycompany.com (écarte A)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 60,"c": "3.01","q": "A customer reports that one of their arrays is NOT showing statistics or information in Pure1. They were able to enable Remote Assist for a Support Specialist to investigate further. What log file should the Support Specialist review to narrow down the cause?","o": ["Review remoteassistd.log [nom incertain], which contains details related to enabling Remote Assist.","Review phonehome.log [nom incertain], which contains information about communication with the Everpure cloud endpoint.","Review ccm.log, which provides insight into communication issues with the Everpure cloud."],"a": [2],"e": "Les statistiques de Pure1 arrivent par la connexion de la baie au cloud Everpure (CCM / Arcus, la nouvelle génération du phone home). La documentation indique que, lorsque la connectivité entre la baie et les serveurs cloud pose problème (purearray test pinghome en échec), « un bon point de départ est /var/log/purity/ccm.log », où l'on cherche les lignes ERROR / WARN et les réponses HTTP. A est écartée : Remote Assist fonctionne, son journal n'expliquera pas l'absence de données dans Pure1. B n'est pas retenue : aucun de vos documents ne cite un fichier phonehome.log.","s": ["ActiveCluster — FlashArray ActiveCluster - Troubleshooting › ActiveCluster - Troubleshooting Mediator Connectivity (étape 2 et note), p. 315-316 : purearray test pinghome teste la connectivité baie ↔ serveurs cloud ; en cas d'échec, commencer par /var/log/purity/ccm.log ; le fichier se trouve dans /var/log/purity.","ActiveCluster — Troubleshooting Mediator Connectivity (« Check for 'ERROR' and 'WARN' in the ccm.log »), p. 317-318 : Recherche des erreurs dans ccm.log, par exemple « Failed to call Arcus » vers rest.cloud-support.purestorage.com.","ActiveCluster — Prérequis ActiveCluster, p. 85 : Arcus/CCM = connexion au cloud Pure1 (« Next Gen v2 of phone home »)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 61,"c": "4.02","q": "A workload shows high SAN latency in the FlashArray latency breakdown, while array service latency remains within its target. What action should the Support Specialist take next?","o": ["Investigate the network path between the host and the FlashArray.","Increase the volume QoS ceiling to reduce array-side b
