uffer exhaustion.","Expand NVRAM capacity to reduce the performance bottleneck."],"a": [0],"e": "Le SAN time est le temps pendant lequel Purity attend l'hôte (les données d'une écriture) ou attend de lui remettre les données lues. Une latence élevée dans cette catégorie indique que le problème se situe hors de la baie : liens lents, congestionnés ou saturés, slow drain en FC, matériel défectueux. Avec un temps de service normal, la baie est hors de cause : il faut examiner le chemin entre l'hôte et la baie. B est écartée : une limite QoS apparaîtrait dans la catégorie « QoS Rate Limit Time », pas en SAN time. C est écartée : un problème de NVRAM se verrait dans la latence interne (file d'attente / service), or le service est dans sa cible.","s": ["FlashArray Performance — Troubleshooting › Purity//FA GUI: Assessing Latency Issues › Latency (SAN Time), p. 19 : SAN time : Purity attend l'hôte ou un blocage dans le SAN (liens lents ou saturés, slow drain, matériel) ; une latence élevée ici indique un problème hors du FlashArray ; en iSCSI, latence SAN = latence réseau.","FASS_Module03_Performance_FR.docx (vidéo) — Synthèse « décomposition de la latence » (SAN / queue / service / QoS), p. 4 : SAN time = externe ; queue et service = internes ; QoS = limite imposée.","Module03_Troubleshooting_FR.docx (vidéo FASP) — Latency: Not Workload-Related --- Troubleshooting (Network Issues), p. 18-19 : Les problèmes réseau se traduisent par de la latence externe, le SAN time : temps passé à transférer la donnée entre l'initiateur et la FlashArray."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 62,"c": "3.04","q": "A customer wants to use SAML2 single sign-on for a Everpure Fusion fleet. Which prerequisite must be met across the fleet?","o": ["Each array must use a different identity provider so fleet tokens do not overlap.","Only the fleet coordinator needs SAML enabled; member arrays can stay local users only.","Each array must use the same identity provider for management-service SAML on a Purity//FA version that supports Fusion SSO."],"a": [2],"e": "Les prérequis Fusion l'énoncent : toutes les baies de la flotte doivent utiliser l'un des deux mécanismes d'authentification pris en charge, dont « configuration SAML2 SSO pour le service de management activée avec le même IdP sur chaque baie de la flotte », disponible à partir de Purity//FA 6.10.5 (Purity//FB 4.6.8). A est écartée : c'est l'inverse, le même IdP partout (idéalement mêmes IdP Entity ID, SP Entity ID et Verification Certificate). B est écartée : la configuration doit exister sur chaque baie, pas seulement sur le coordinateur.","s": ["Everpure Fusion Fusion Administration Guide — Everpure Fusion Administration Guide › Fusion Requirements and Recommendations, p. 4 : SAML2 SSO pour le service de management activé avec le même IdP sur chaque baie de la flotte ; disponible en Purity//FA 6.10.5 ou ultérieur ; SAML2 SSO pour Fusion exige Purity//FA 6.10.5+.","Everpure Fusion Fusion Administration Guide — Fusion SAML Single Sign-On › SAML2 SSO Authentication for FlashArray (« Consistent IdP and SP Entity IDs across Fleet »), p. 18 : Configuration recommandée : mêmes IdP Entity ID, SP Entity ID et Verification Certificate sur toutes les baies de la flotte.","purity_fa_admin_guide_pdf_6122 — Fleet › Fleet Management (prérequis) ; SAML dans une flotte, p. 439 et 446 : Mêmes prérequis d'authentification pour les baies d'une flotte."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 63,"c": "4.02","q": "A Support Specialist wants to scrape array-only metrics from the FlashArray native OpenMetrics endpoint. Which authentication method should they use?","o": ["A directory-service password sent without an authorization header","An API token from a FlashArray local user with Ops Administrator or Array Administrator rights","An HTTP Authorization header with a Bearer FlashArray API token"],"a": [2],"e": "La documentation OpenMetrics du FlashArray précise : l'authentification se fait par l'en-tête HTTP Authorization de type « Bearer », avec un api-token FlashArray. Exemple fourni : curl -k 'https://<baie>/metrics/array?namespace=purefa' –header 'Authorization: Bearer <api-token>' ; /metrics/array est justement le point d'accès « array-only ». A est écartée : pas de mot de passe, et l'en-tête d'autorisation est obligatoire. B n'est pas la meilleure réponse : la documentation recommande au contraire un utilisateur dédié avec des droits en lecture seule (pas besoin de droits d'administration), et B ne décrit pas la méthode (en-tête Bearer).","s": ["Purity__FA General Administration — FlashArray OpenMetrics Exporter › Authentication, p. 174 : Authentification par l'en-tête HTTP Authorization de type 'Bearer' avec un api-token FlashArray ; utilisateur dédié en lecture seule recommandé ; exemple curl sur /metrics/array.","Purity__FA General Administration — FlashArray OpenMetrics Exporter (tableau des points d'accès), p. 175 : /metrics = toutes les métriques ; /metrics/array = métriques de la baie uniquement (purefa_info, purefa_alerts, purefa_array, purefa_hw, purefa_network, purefa_drive).","FlashArray FlashArray Release Notes — Export Metrics Natively in OpenMetrics Format, p. 257 : OpenMetrics natif : collecte en temps réel des métriques de la baie, sans serveur ni conteneur externe."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 64,"c": "4.04","q": "What is the goal of QoS fairness in the context of I/O operations on a FlashArray?","o": ["To prioritize volumes using the least amount of array resources","To guarantee the fastest service time for high-priority I/O by delaying lower-priority operations","To ensure busy and less busy volumes and pods receive a fair share of resources, preventing starvation"],"a": [2],"e": "La QoS fairness empêche la baie d'être submergée par les E/S de tous les hôtes et garde les volumes peu actifs réactifs même quand de grosses charges occupent la baie : en contention, elle suspend des E/S des volumes les plus chargés et reprend d'abord le volume qui a fait le moins de travail récemment. L'objectif est un partage équitable, pour qu'aucun volume ne soit privé de ressources (isolation du « noisy neighbor »). A est proche mais incomplète : favoriser le volume le moins servi est le moyen, pas le but ; le but est l'équité entre volumes actifs et peu actifs. B est écartée : la fairness ne connaît pas de niveaux de priorité d'E/S, elle n'est pas configurable.","s": ["FASS_Module03_Performance_FR.docx (vidéo) — Slide « Comment ça marche ? (QoS Fairness) » et commentaire à 46:52, p. 38 : Évite que la baie soit submergée ; garde les volumes peu actifs réactifs quand la baie est occupée par de grosses charges ; reprise selon l'utilisation récente ; isolation du noisy neighbor.","FASS_Module03_Performance_FR.docx (vidéo) — Slide « Qu'est-ce que la QoS ? » (QoS Fairness, toujours active), p. 37 : Toujours active, à l'échelle de la baie, gérée par Purity, non configurable.","FlashArray Performance — Troubleshooting › Performance Troubleshooting › Using Visual Perf Report (QoS v1), p. 58 : QoS v1 (fairness) : suspend les E/S des volumes les plus chargés quand les temps de service internes dépassent les seuils."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 65,"c": "5.01","q": "A Support Specialist is troubleshooting slower than expected replication between arrays and needs to confirm which Ethernet interfaces are carrying replication traffic and what speeds they negotiated. Which CLI command should they run first?","o": ["purehw list –sfp –static [options illisibles]","purenetwork list –all","purenetwork eth list –all"],"a": [2],"e": "purenetwork eth list –all affiche, pour chaque interface Ethernet, les colonnes Enabled, Address, MTU, Speed et Services : on y lit directement quelles interfaces portent le service « replication » et à quelle vitesse elles ont négocié (par exemple ct0.eth2, 25.00 Gb/s, replication). C'est la première commande du guide de dépannage réseau. A est écartée : purehw list décrit le matériel, pas les services portés par les interfaces. B est écartée : la syntaxe correcte passe par le sous-objet « eth » (purenetwork eth list) ; purenetwork list seul n'est pas la forme documentée pour les interfaces Ethernet.","s": ["FlashArray Connectivity — Troubleshooting › Troubleshooting FlashArray SAN Networking › Troubleshooting Network Hardware (Remote) (« purenetwork [eth/fc] list »), p. 115 : Exemple de sortie de purenetwork eth list –all : colonnes Speed et Services ; ct0.eth2 / ct0.eth3 à 25.00 Gb/s avec le service replication.","FlashArray Connectivity — Troubleshoot FlashArray Ethernet Connectivity with Purenetwork (Gather Information), p. 133-135 : Identifier l'interface source avec purenetwork eth list ; pour un chemin de réplication, purearray list –connect –path puis tester les IP de réplication trouvées dans purenetwork eth list.","purity_fa_cli_guide_pdf_6122 — Purity//FA CLI Commands › purenetwork (synopsis de purenetwork eth list), p. 362 : Syntaxe : purenetwork eth list [–service SERVICE] [–subnet SUBNET]..."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 66,"c": "3.02","q": "What can cause a Fibre Channel (FC) Continue Target Input/Output (CTIO) error to occur?","o": ["An initiator failing to respond to an fcp_xfer_rdy request from the array within four seconds","The array failing to handle a write payload in the alloc_done_to_exec HBA driver stage within two seconds","The count of driver stalls that are longer than 50ms going above 1000 within a one second window"],"a": [0],"e": "La documentation de l'alerte 5002 décrit le mécanisme : l'initiateur envoie une requête WRITE ; la baie répond « prêt à transférer » (FCP_XFER_RDY) ; l'initiateur a alors 4 secondes pour envoyer toutes les données de l'écriture. Si ce délai de 4 secondes expire, la baie génère un timeout CTIO (check condition SCSI, BUS DEVICE RESET FUNCTION OCCURRED). B et C sont écartées : alloc_done_to_exec et les « driver stalls » sont des notions de latence interne du pilote (tampons d'E/S), sans lien avec la définition du timeout CTIO, et les seuils cités (2 secondes, 1000 par seconde) n'apparaissent pas dans la documentation.","s": ["Purity__FA Alerts — Alert 5002 - CTIO Timeout › Impact, p. 322 : WRITE → FCP_XFER_RDY → l'initiateur a 4 secondes pour envoyer les données ; à l'expiration, un timeout CTIO est généré. Seconde condition : perte de paquets ou erreurs de transport dans le SAN FC.","m04-fasp-troubleshooting — Schéma du chemin d'écriture (Write_Rqst / Xfer_Rdy), p. 18 : Séquence Write request → Xfer_Rdy entre l'hôte et la baie.","FASS_Module03_Performance_FR.docx (vidéo) — Tampons d'E/S et blocages du pilote (entrée « driver stall »), p. 2 : alloc_done_to_exec : étape du pilote entre l'allocation des tampons et l'exécution ; notion distincte du CTIO."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 67,"c": "2.01","q": "Refer to the exhibit. itadmin@fa122-1> purefleet member add –fleet T1 –fleet-key Enter the fleet key of the target fleet: CAxSJDF... **Error: Key CAxSJDFjMDF not valid in fleet** A customer runs the command purefleet member add –fleet <fleet name> –fleet-key <key> and receives the error 'Error: Key not valid in fleet'. What is the most likely cause of this issue?","o": ["The array being added is running a Purity//FA version that does NOT meet the minimum requirement for Fusion.","The fleet key is invalid due to a mismatch or reuse from a previous attempt.","There are network connectivity issues between the arrays."],"a": [1],"e": "Le message porte sur la clé elle-même. Une clé de flotte est à usage unique et de courte durée : elle expire au bout d'une heure ou à sa première utilisation, et une seule clé est valide à un instant donné (en créer une seconde supprime la première). Une clé déjà utilisée, expirée ou remplacée est donc refusée ; il faut en générer une nouvelle (purefleet create –fleet-key) pour chaque baie. A est écartée : une version trop ancienne ne proposerait pas la commande purefleet ou renverrait une erreur de version, pas de clé. C est écartée : un problème réseau empêcherait de joindre la flotte ; ici la flotte a répondu et a rejeté la clé.","s": ["purity_fa_admin_guide_pdf_6122 — Fleet › Fleet Management (règles des clés de flotte) ; Generating a Fleet Key, p. 439-440 : Chaque clé de flotte expire après une heure ou à sa première utilisation ; une seule clé valide à la fois ; clé à usage unique.","Everpure Fusion Fusion Administration Guide — Setting Up a Fleet › Generating a Fleet Key and Joining a Fleet (Important), p. 24 : Ajouter les baies une par une ; générer une nouvelle clé à usage unique pour chaque baie ; ne pas réutiliser une clé.","Everpure Fusion Fusion Administration Guide — Exemple « purefleet create –fleet-key », p. 28 : Sortie montrant les colonnes Fleet Key / Created / Expires (expiration une heure après la création).","Everpure Fusion — Tableaux de sécurité (Unauthorized Fleet Membership ; Fleet Formation/Join), p. 46 et 54 : Clé de flotte à usage unique et limitée dans le temps."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 68,"c": "5.02","q": "Which commands should a Support Specialist use to validate sync replication connectivity, mediator state, and pod online status during an ActiveCluster health check?","o": ["purearray list –connect, purepod list –mediator, and purepod list","purearray list –connect, purepod health –mediator, and purepod list","purearray list –connect, puremediator list –status, and purepod list"],"a": [0],"e": "Les trois besoins correspondent à trois commandes documentées : purearray list –connect (connexion de réplication entre les baies, type sync-replication, statut), purepod list –mediator (état du médiateur pour chaque pod : « le moyen le plus simple et le plus rapide de vérifier la santé du médiateur en direct ») et purepod list (statut online / offline / resyncing de chaque baie du pod). B et C sont écartées : il n'existe ni sous-commande « purepod health » ni commande « puremediator » dans la CLI Purity//FA ; l'état du médiateur se lit avec purepod list –mediator.","s": ["ActiveCluster — FlashArray ActiveCluster - Troubleshooting › ActiveCluster - Troubleshooting Mediator Connectivity, p. 314-316 : purepod list –mediator : moyen le plus simple et rapide de vérifier la santé du médiateur en direct sur la baie ; exemple de sortie avec Mediator Status.","ActiveCluster — Exemples de sortie « purearray list –connect » et « purepod list », p. 72 et 75 : purearray list –connect : baies connectées, adresses de réplication, type et statut ; purepod list : statut de chaque baie du pod.","ActiveCluster — Statuts d'un pod (online / resyncing / offline) et « purepod list –mediator », p. 83 : Signification des statuts de pod et colonne Mediator Status.","ActiveCluster — Déploiement du médiateur sur site (vérification), p. 141-143 : « You can also review mediator status per pod with purepod list –mediator »."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 69,"c": "5.06","q": "In the context of FlashArray asynchronous replication, how do inline deduplication and compression optimize data efficiency during transfer?","o": ["The source array compresses the data, the target decompresses it, then deduplicates it before writing to SSD.","The source array deduplicates data, reads it uncompressed, then compresses it before sending to the target.","The source array compresses the data, sends it in compressed format, and the target deduplicates it inline."],"a": [2],"e": "Le processus de réplication est décrit pas à pas : les données différentielles sont lues sur SSD à la source au format compressé ; les données uniques sont transmises à la cible au format compressé ; la cible reçoit les données compressées et les prépare pour la déduplication en ligne, qui les réduit par rapport aux autres flux entrants et aux données déjà présentes ; elles sont enfin écrites sur SSD au format compressé. A est écartée : la cible ne décompresse pas pour écrire, les données restent compressées jusqu'au SSD. B est écartée : la source lit les données déjà compressées, elle ne les lit pas décompressées pour les recompresser.","s": ["Asynchronous — FlashArray Asynchronous - Overview › Asynchronous Replication Solution Overview › The Replication Process (étapes 2 à 6), p. 7 : Lecture à la source au format compressé ; transmission au format compressé ; déduplication en ligne sur la cible ; écriture compressée sur SSD.","Asynchronous — Data Reduction Support (point « Compression »), p. 8 : Les données transférées par la réplication asynchrone sont toujours compressées sur le lien.","m05-fasp-data-protection — Slide sur la réplication asynchrone, p. 56 : Compression sur le lien pour réduire les besoins en bande passante."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 70,"c": "4.01","q": "During a data migration, the customer reports a drop in array performance and receives Alert 25, while host connectivity remains stable. What should the Support Specialist do in this situation?","o": ["Investigate Array Capacity","Investigate the SAN performance","Investigate QoS Rate Limiting"],"a": [0],"e": "L'alerte 25 est « Storage Consumption has Reached X% of Usable Capacity » : la baie se remplit (seuils à 80 %, 90 % puis 100 %, où l'alerte devient critique et précise que les performances d'E/S peuvent se dégrader). Une migration de données remplit la baie ; la baisse de performance est donc liée à la capacité. La première question du guide de dépannage de latence est d'ailleurs : l'espace est-il proche ou au-delà de 100 % (alerte 25) ? B est écartée : la connectivité des hôtes est stable et l'alerte 25 n'a rien à voir avec le SAN. C est écartée : une limite QoS ne déclenche pas l'alerte 25.","s": ["Purity__FA Alerts — FlashArray Support Case Alerts › Alert 25 - Storage Consumption has Reached X% of Usable Capacity, p. 38-39 : Exemples à 82 %, 92 % et 102 % ; à 100 % : « I/O performance may degrade at 100% capacity utilization » ; action suggérée : augmenter la capacité.","FlashArray Performance — Troubleshooting › Purity//FA GUI: Assessing Latency Issues (liste de contrôle), p. 29 : Première vérification d'un problème de latence : l'espace du FlashArray est-il proche de 100 % ou au-delà ? (Alert 25).","FlashArray Space — Space Reference › System Space Explained, p. 4 : À 100 % de remplissage, Purity commence à brider les écritures (write throttling)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 71,"c": "1.01","q": "Alert 60 clears after a drive temporarily recovers. Before closing the case, what should the Support Specialist do?","o": ["Confirm that parity is back to 100% and continue monitoring for recurrence.","Run puredrive erase, confirm parity is back to 100%, and monitor for recurrence.","Power-cycle the affected drive and monitor for recurrence."],"a": [0],"e": "L'alerte 60 est « Drive Failure Detected ». La consigne destinée aux partenaires de support est claire : si le périphérique en panne est revenu à l'état sain, on s'arrête là ; on surveille le disque pendant 24 heures et, sans nouveau problème, on clôture. Comme une perte de disque entraîne une reconstruction RAID, on vérifie que la parité est bien revenue à 100 % avant de clôturer. Des erreurs qui se répètent sur le même disque conduisent à un remplacement proactif. B est écartée : puredrive erase efface un disque (procédure d'effacement sécurisé), ce n'est pas une vérification et rien ne le justifie pour un disque rétabli. C est écartée : le redémarrage électrique de l'emplacement est une action que le support technique peut recommander pour un disque encore en défaut, pas pour un disque déjà rétabli.","s": ["Purity__FA Alerts — FlashArray Support Case Alerts › Alert 60 - Drive Failure Detected › Troubleshooting (Authorized Support Partner Note, point a), p. 58 : Si le périphérique en panne est maintenant sain, s'arrêter là : surveiller le disque 24 heures puis clôturer le dossier s'il n'y a pas d'autre problème.","Purity__FA Alerts — Alert 60 - Drive Failure Detected › Impact et Resolution, p. 57 : Purity tente d'abord de récupérer le disque ; SSD perdu = reconstruction RAID ; actions possibles : redémarrage électrique via Remote Assist, RMA, ou aucune action si le disque s'est rétabli seul ; remplacement proactif si les erreurs se répètent.","FlashArray__X — FlashArray//X Troubleshooting › Controller Fails to Identify Drive on FlashArray//X (note), p. 432 : puredrive erase : commande d'effacement sécurisé, à ne pas lancer si une reconstruction de parité est en cours."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 72,"c": "2.04","q": "A customer reports that an eligible array does not appear ready for Self-Service Upgrade (SSU). The customer has configured step-up authentication. What should the Support Specialist do next?","o": ["Verify the array is phoning home and that the Entitlement Agent is enabled.","Verify the array is phoning home and that the Edge Agent Update is enabled.","Reinstall the Upgrade Agent manually on the live array before enabling any Edge Services."],"a": [1],"e": "Les prérequis de la SSU sont : version de Purity éligible (acquis), compte Pure1 avec authentification renforcée (acquis), puis Phonehome, Edge Management et Edge Agent Update activés sur la baie, contrôle de conformité, et agent de mise à niveau Purity//FA installé. Les deux premiers étant remplis, on vérifie avec puresupport list que Phonehome et Edge Agent Update sont à True (sinon : puresupport enable phonehome / edge-agent-update). A est écartée : l'Entitlement Agent sert à d'autres fonctions (capacité), il ne fait pas partie des prérequis SSU. C est écartée : l'ordre est inverse, l'agent de mise à niveau ne peut être installé que si Edge Management et Edge Agent Update sont déjà activés, et il s'installe depuis Pure1.","s": ["Pure1 Manage - Dashboard — Pure1 Manage - Software Lifecycle › Purity Upgrades › Self-Service Upgrades Prerequisites (points 1 à 5), p. 76 : Version éligible ; authentification step-up ; Phonehome, Edge Management et Edge Agent Update activés ; contrôle de conformité ; Purity//FA Upgrade Agent installé.","Pure1 Manage - Dashboard — Enable The Prerequisite Services on Your Appliance, p. 77-78 : Trois services à activer en CLI (puresupport list / puresupport enable ...) ; Edge Agent Update permet d'installer des agents sur la baie, dont l'agent de mise à niveau ; l'agent exige Edge Management et Edge Agent Update activés.","FASS_Module05_Install_Upgrade_FR.docx (vidéo) — Slides « Prérequis pour utiliser la SSU » et « Résumé : processus SSU », p. 23 et 31 : Phone home, Edge Management et Edge Agent Update activés sur la baie ; authentification renforcée TOTP ; Purity 6.2.10 minimum.","Pure1 Manage - Administration — Dépannage « Eligible (updates disallowed) », p. 92 : Ce statut signifie que l'Edge Agent Update est désactivé sur la baie : puresupport enable edge-agent-update."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 73,"c": "1.03","q": "A customer with an FA//XLR5 array asks whether a second DirectFlash Shelf can be added during a planned maintenance window. The array will run Purity//FA 6.10.6 [version incertaine] and the customer confirms slot 5 is free. How should the Support Specialist proceed?","o": ["Explain that slot 5 cannot be used for DFS connectivity.","Explain that a Mellanox ConnectX-6Dx would have to be installed in slot 5.","Explain that an Intel add-in card would have to be installed in slot 5."],"a": [0],"e": "Sur un //XL R5, la connectivité des DirectFlash Shelves utilise les slots PCIe 0 et 6 : la carte NVMe (FA-XL-200G Ethernet/RoCE 2 ports CX7) du slot 0 relie le premier DFS, celle du slot 6 le second. Le slot PCIe 5 est réservé aux cartes NDU ou DCAv2 (DirectCompress Accelerator). Un slot 5 libre ne permet donc pas de raccorder un second shelf : il faut le slot 6. B et C sont écartées : aucune carte, Mellanox ou Intel, ne s'installe dans le slot 5 pour un DFS ; la carte prévue est la 200G CX7, dans les slots 0 et 6.","s": ["FlashArray__XL — FlashArray//XL Product Information › FlashArray//XLR5 Port Usage and Definitions (notes), p. 29-30 : Pour ajouter un DFS Gen2, réserver le slot PCIe 0 ou 6 pour la connectivité du shelf ; le PCIe 5 est réservé aux cartes NDU ou DCAv2 ; carte FA-XL-200G CX7 dans les slots 0 et 6.","FlashArray__XL — FlashArray//XLR5 Hardware FAQ (shelves), p. 41-42 : Maximum 2 DirectFlash Shelves ; carte NVMe du slot 0 → 1er DFS (câbles A, B, D, C) ; carte NVMe du slot 6 → 2e DFS (câbles E, F, G, H).","FlashArray__XL — Configurations par modèle (DCAv2 en slot 5), p. 31 : DirectCompress Accelerator (DCAv2) en slot 5 sur les //XL R5."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 74,"c": "4.01","q": "What action should a Support Specialist recommend to help mitigate Fibre Channel slow drain issues in the SAN?","o": ["Separate the management and data traffic onto different VLANs.","Update the firmware on all connected devices to the latest version.","Increase the buffer-to-buffer credits on all switches and connected devices."],"a": [1],"e": "Le slow drain vient d'un équipement qui n'acquitte pas les trames FC assez vite. La documentation en donne les causes les plus courantes : matériel défectueux, problèmes de pilote ou de firmware, mauvaise conception du SAN, et précise que de nombreux bugs peuvent causer des pertes de crédits. Mettre à niveau les firmwares des équipements connectés traite directement la deuxième cause. A est écartée : les VLAN concernent l'Ethernet, pas un fabric Fibre Channel, et le management n'est pas en cause. C n'est pas retenue : le nombre de crédits B2B est négocié par lien au FLOGI ; l'augmenter partout ne corrige pas un équipement lent ou un bug qui perd des crédits, et la documentation ne le propose pas.","s": ["FlashArray Block Services — FlashArray Block - Troubleshooting › Slow Drain › Troubleshooting Slow Drain (Switch), p. 206 : Causes les plus courantes du slow drain : 1. matériel défectueux, 2. problèmes de pilote ou de firmware, 3. mauvaise conception du SAN.","FlashArray Block Services — Slow Drain (actions pour remédier aux problèmes courants), p. 207 : Séparer les équipements lents dans un autre SAN ; réduire leur profondeur de file ; remplacer le matériel défectueux ; équilibrer la charge ou ajouter des ISL ; de nombreux bugs peuvent causer des pertes de crédits.","FlashArray Block Services — Slow Drain › What is Slow Drain? / What are Buffer to Buffer credits?, p. 204-205 : Définition du slow drain et du contrôle de flux B2B ; les crédits sont négociés par lien physique au FLOGI."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 75,"c": "3.04","q": "A customer manages one array locally, but remote Everpure Fusion operations to another fleet member fail. TLS 443 connectivity is already open between arrays. Which configuration issue is the most likely cause?","o": ["The arrays have identical management certificates.","The domain controller can no longer be contacted.","Port 8117 is not open in the firewall between the arrays."],"a": [1],"e": "Fusion n'a que deux exigences entre membres : la communication sur le port 443 par les interfaces de management (ici acquise) et un mécanisme d'authentification commun, services d'annuaire (Active Directory / LDAP) configurés de façon cohérente sur chaque baie, ou SAML2 SSO avec le même IdP. Les opérations distantes (–context) exigent un utilisateur LDAP : si le contrôleur de domaine n'est plus joignable, la baie distante ne peut plus authentifier ni autoriser l'utilisateur, alors que la gestion locale continue de fonctionner (compte local). A est écartée : la confiance entre membres repose sur des certificats de flotte gérés et renouvelés automatiquement par le coordinateur, pas sur les certificats de management. C est écartée : le port 8117 sert à la réplication, pas à Fusion, dont le seul port requis est le 443.","s": ["Everpure Fusion Fusion Administration Guide — Everpure Fusion Administration Guide › Fusion Requirements and Recommendations, p. 4 : Les baies communiquent sur le port 443 par les ports de management ; toutes doivent avoir des services d'annuaire (AD ou LDAP) activés avec une configuration cohérente, ou SAML2 SSO avec le même IdP.","Everpure Fusion — Network Firewall and Ports Required, p. 50 : Communication de flotte Fusion : TCP 443 (mTLS), bidirectionnel, entre les adresses IP de management ; le port 443 est requis.","FASS_Module02_Software_FR.docx (vidéo) — Synthèse « Fusion : droits, versions et dépannage » et « LDAP pour Fusion », p. 3 et 5 : Toutes les commandes purefleet sauf list exigent un utilisateur LDAP ; opérations distantes (–context) : LDAP aussi ; Fusion exige AD ou LDAP cohérent sur toutes les baies.","FlashArray Connectivity — FlashArray TCP and UDP Port Assignments (ligne Replication), p. 15 : Port 8117 : réplication (asynchrone, ActiveCluster, ActiveDR)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 76,"c": "1.03","q": "During a visual check on a Gen 2 FlashArray//XR5 chassis, the onsite engineer notices 28 slots and no dedicated NVRAM bays. How should the Support Specialist interpret this information?","o": ["The Gen 2 hardware uses distributed NVRAM on DFMDs.","In the Gen 2 chassis, slots 0, 1, 2, and 3 are used for dedicated NVRAM.","The NVRAM slots are on the rear of the Gen 2 chassis."],"a": [0],"e": "Le châssis Gen 2 supprime les NVRAM dédiées : les anciens emplacements NVRAM sont convertis pour recevoir des modules supplémentaires, d'où 28 emplacements de DFMD, et la fonction NVRAM est assurée par la NVRAM distribuée (DNVR) des DFMD (DirectFlash Modules with Distributed NVRAM). B est écartée : il n'y a plus d'emplacements NVRAM dédiés sur le Gen 2. C est écartée : la vue arrière du châssis Gen 2 est identique à celle du Gen 1 (R4b), elle ne contient pas de NVRAM.","s": ["FASS_Module01_Hardware_FR.docx (vidéo) — Slides « Châssis Gen2 (FlashArray//XCR) » à 35:41 et « FlashArray//XCR avec châssis Gen2 » à 36:40, p. 23-24 : Plus de NVRAM dédiées, tous les emplacements reçoivent des modules DirectFlash ; slots NVRAM convertis pour 8 DFMD supplémentaires (maximum 28) avec la NVRAM distribuée (DNVR) ; même vue arrière que le Gen 1.","FlashArray__X — FlashArray//XR5 Hardware FAQ › « What type of storage media is supported in FlashArray//XR5? », p. 31 : DFMD (NVRAM distribuée) ; le châssis Gen2 n'a pas d'emplacements distincts pour des modules NVRAM dédiés.","FlashArray__C — FAQ « How many DFMc slots does FlashArray//CR5 Chassis Gen2 have? », p. 13 : Le châssis Gen2 a 28 emplacements au total."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 77,"c": "2.01","q": "When troubleshooting a failover, which of the following log lines would most likely indicate an expected failover?","o": ["Feb 11 10:15:09 [alert_util:WARNING] Sending alert: Subject: Controller thisexample-ct1.purestorage.com rebooted [192] [transcription approximative]","Feb 10 11:14:30.886 0030000076FJ B landlord.logging landlord transitions Secondary -> Takeover [transcription approximative]","Feb 10 11:14:14.479 examplearray-ct0 bash[160592]: root:pureboot reboot –primary [transcription approximative]"],"a": [2],"e": "Un basculement planifié est un basculement lancé manuellement : sa seule cause est une commande demandant au primaire d'entrer en Giveback pour laisser son pair se promouvoir. La ligne C est l'historique bash : quelqu'un (root) a tapé « pureboot reboot –primary » sur le contrôleur primaire, commande que la documentation donne justement pour effectuer un basculement manuel. C'est la preuve d'un basculement voulu. A est écartée : l'alerte « contrôleur redémarré » dit qu'un redémarrage a eu lieu, pas qu'il était voulu. B est écartée : la transition Secondary → Takeover se produit dans tout basculement, planifié ou non ; elle n'en indique pas la cause.","s": ["Purity__FA General Administration — FlashArray HA Failover › Planned Failover, p. 55-56 : Un basculement planifié est effectué manuellement ; il n'a pas d'événement déclencheur autre qu'une commande pour entrer en Giveback et laisser le pair se promouvoir.","Purity__FA General Administration — Do Not Run puredb run giveback On Certain Purity Versions › Workaround, p. 22 : Pour un basculement manuel : vérifier que l'on est sur le primaire, puis « pureboot reboot –primary ».","Purity__FA General Administration — FlashArray HA Failover › Key Terminology, p. 53 : Takeover : état d'un secondaire en cours de promotion en primaire (présent dans tout basculement).","Support Tools — FlashArray CLI Tools › All Commands, p. 9 et 13 : fa timeline bash : historique des commandes bash ; fa health failover : vérifie la santé du système et la cause d'un basculement."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 78,"c": "2.01","q": "During a ransomware-readiness exercise, an administrator tries to eradicate protected snapshots, and the action is blocked. What explains this behavior?","o": ["The administrator role can create snapshots but cannot eradicate any snapshots from the array.","Protected snapshots must first be removed from their protection group before eradication is allowed.","SafeMode keeps snapshots immutable against accidental or malicious removal."],"a": [2],"e": "SafeMode est le service de protection contre les ransomwares : il empêche la suppression manuelle immédiate des snapshots, verrouille la corbeille d'éradication pendant un délai configurable (rien ne peut être effacé avant son expiration) et exige une autorisation multipartie avec authentification multifacteur, via Everpure, pour tout changement de politique. Même un administrateur dont le compte serait compromis ne peut pas éradiquer les snapshots protégés. A est écartée : sans SafeMode, un administrateur peut détruire puis éradiquer des snapshots. B est écartée : avec SafeMode, on ne peut justement pas contourner la protection en modifiant le groupe de protection ; ces changements exigent l'approbation multipartie.","s": ["FlashArray Security — FlashArray - Protocols and Data Security › FlashArray SafeMode › FlashArray SafeMode FAQ (« What is FlashArray SafeMode? »), p. 142 : Service d'atténuation des ransomwares : empêche la suppression manuelle immédiate des snapshots ; autorisation multipartie avec MFA pour tout changement des politiques de protection ; délai d'éradication configurable.","FlashArray Security — FlashArray SafeMode FAQ › Eradication Delay, p. 150 : Quand SafeMode est activé, la corbeille d'éradication est verrouillée pour une durée configurable (jusqu'à 30 jours) ; rien ne peut être effacé avant ce délai.","FASS_Module04_SafeMode_FR.docx (vidéo) — Synthèse « Qu'est-ce que c'est ? » et points clés, p. 2-3 : SafeMode : verrou qui empêche la suppression ou l'éradication accidentelle ou malveillante de snapshots, y compris par un administrateur au compte compromis."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 79,"c": "5.02","q": "During the deployment of an ActiveCluster On-Premises Mediator, which network configuration requirement is essential to ensure proper communication between the mediator and the FlashArrays?","o": ["The mediator must have a public IP address.","The mediator must be installed on the same datacenter as the FlashArrays.","The FlashArrays must be able to access the mediator on port 80."],"a": [2],"e": "Le guide de déploiement du médiateur sur site liste parmi ses prérequis : « Arrays must be able to access the mediator on port 80 ». Le dépannage le confirme : on teste le médiateur sur site depuis la baie avec curl http://<médiateur>/mediator/1.0/mediator (HTTP, port 80). A est écartée : une adresse IP disponible (DHCP ou statique, IPv4) suffit, elle n'a pas à être publique. B est écartée : c'est l'inverse, le médiateur doit être installé sur un troisième site, dans un domaine de panne distinct de celui des deux baies.","s": ["ActiveCluster — FlashArray ActiveCluster - Deployment › ActiveCluster On-Premises Mediator Deployment Guide (prérequis), p. 135 : Une adresse IP disponible, DHCP ou statique, IPv4 uniquement ; les baies doivent pouvoir accéder au médiateur sur le port 80.","ActiveCluster — Prérequis ActiveCluster (médiateur sur site), p. 85 : Le médiateur sur site doit être installé sur un 3e site, dans un domaine de panne distinct de celui de chaque baie.","ActiveCluster — ActiveCluster - Troubleshooting Mediator Connectivity (médiateur sur site), p. 321 : Vérification depuis la baie : curl http://<mediator IP or Name>/mediator/1.0/mediator."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 80,"c": "2.02","q": "Which command should a Support Specialist advise a customer to run to verify if the array receives the I/O to both controllers equally?","o": ["purehost monitor –balance","iobalance [lecture incertaine]","purehost balance –monitor"],"a": [0],"e": "purehost monitor –balance affiche le nombre d'E/S sur chaque chemin entre l'hôte et les contrôleurs ; idéalement, les compteurs de tous les chemins doivent être aussi proches que possible. C'est la commande de la CLI utilisateur pour vérifier l'équilibre des E/S entre CT0 et CT1 ; elle se combine avec –interval et –repeat. B n'est pas retenue : iobalance est l'outil équivalent côté support (shell root), pas une commande que l'on fait exécuter au client. C est écartée : la syntaxe est inversée, « balance » n'est pas une sous-commande de purehost ; c'est une option de la sous-commande monitor.","s": ["purity_fa_cli_guide_pdf_6122 — Purity//FA CLI Commands › purehost (synopsis, option –balance, description), p. 272, 276 et 286 : purehost monitor [–balance] ... ; –balance : affiche les détails d'équilibre des E/S ; compteurs d'E/S sur chaque chemin entre l'hôte et le contrôleur, idéalement aussi proches que possible.","Dark Site Support — FlashArray On-Premises Dark Site Health Checks › Execution (ligne « IO Balance and Connectivity Checks »), p. 105 : Contrôle d'équilibre des E/S : purehost monitor –balance –interval 60.","FlashArray FlashArray Release Notes — Host I/O Balance Monitoring, p. 270 : Cite les deux commandes : iobalance et purehost monitor –balance (contrôle de santé des E/S).","FlashArray__X — Procédures de mise à niveau (test iobalance des contrôles de santé), p. 266 et 269 : iobalance : test des contrôles de santé exécuté par le support, 30 à 60 secondes maximum ; si un hôte n'a des E/S que sur un contrôleur, ne pas poursuivre."],"qt": [],"x": [],"si": [],"ns": false,"r": false}];

/* storage (per-viewer convenience only) */
const KEY='fasscertif-entrainement-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return {}}}
function save(p){try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}}
let prog = load();
/* theme: dark by default, light on request, remembered per viewer */
const TKEY='fasscertif-theme';
function getTheme(){try{return localStorage.getItem(TKEY)==='light'?'light':'dark'}catch(e){return 'dark'}}
function applyTheme(m){document.documentElement.setAttribute('data-theme',m);const b=document.getElementById('themebtn');if(b){b.textContent=m==='light'?'Fond sombre':'Fond clair';b.setAttribute('aria-label',m==='light'?'Passer au fond sombre':'Passer au fond clair')}}
function toggleTheme(){const m=getTheme()==='light'?'dark':'light';try{localStorage.setItem(TKEY,m)}catch(e){}applyTheme(m)}
applyTheme(getTheme());
/* in-progress session (per-viewer convenience only): lets a paused run be resumed, including from another tab of the same browser */
const SKEY='fasscertif-session-v1';
function saveSession(){ if(!S) return; try{ localStorage.setItem(SKEY, JSON.stringify({mode:S.mode, ids:S.qs.map(q=>q.id), i:S.i, ans:S.ans, done:S.done, t0:S.t0, ord:S.ord})) }catch(e){} }
function loadSession(){ try{ const r=localStorage.getItem(SKEY); return r?JSON.parse(r):null }catch(e){ return null } }
function clearSession(){ try{ localStorage.removeItem(SKEY) }catch(e){} }
function resumeSession(){
  const s=loadSession(); if(!s) return;
  const qs=s.ids.map(id=>Q.find(q=>q.id===id)).filter(Boolean);
  if(!qs.length){ clearSession(); home(); return; }
  S={mode:s.mode, qs:qs, i:Math.min(s.i, qs.length-1), ans:s.ans||{}, done:s.done||{}, t0:s.t0||Date.now(), ord:s.ord||{}};
  qs.forEach(q=>{ if(!S.ord[q.id]) S.ord[q.id]=shuffle([...Array(q.o.length).keys()]); });
  clearInterval(timer);
  if(S.mode==='exam') timer=setInterval(()=>{const e=document.getElementById('clock'); if(e) e.textContent=fmt(Math.floor((Date.now()-S.t0)/1000))},1000);
  question();
}

const app = document.getElementById('app');
function h(tag, attrs, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v===false||v==null) continue;
    if(k==='class') e.className=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(k==='html') e.innerHTML=v;
    else e.setAttribute(k, v===true?'':v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;
}
function mount(...nodes){ app.replaceChildren(...nodes.flat().filter(Boolean)); window.scrollTo(0,0); }
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(s){const m=Math.floor(s/60),r=s%60;return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0')}
function lightbox(src){
  const o=h('div',{class:'lb',role:'dialog','aria-label':'Image agrandie',onclick:()=>o.remove()},h('img',{src,alt:'Extrait de la documentation'}));
  document.body.append(o);
  const esc=e=>{if(e.key==='Escape'){o.remove();document.removeEventListener('keydown',esc)}};
  document.addEventListener('keydown',esc);
}

/* shared pieces */

  return h('div',{class:'top'},
    h('div',{class:'brand'},h('span',{class:'mark','aria-hidden':'true'},'FA'),'Entraînement FASS'),

function chip(q){
  const dm=dom(q.c[0]);
  return h('span',{class:'chip'},h('i',{class:'dot d'+dm.k}),dm.n,' · ',h('span',{class:'mono'},q.c),' ',objName(q.c));

function sourcesBlock(q){
  const kids=[h('h3',null,'Sources')];
  if(q.r && !q.s.length) kids.push(h('p',{class:'muted'},'Question reconstituée de mémoire, sans source officielle associée.'));
  else if(q.ns || !q.s.length) kids.push(h('p',{class:'muted'},'Aucune source officielle identifiée pour cette question.'));
  else q.s.forEach((s,i)=>kids.push(h('p',null, i? h('b',null,'Complément : '):null, s)));
  q.qt.forEach(t=>kids.push(h('blockquote',null,t)));
  if(q.si.length){
    const w=h('div',{class:'shot'}, h('small',null,'Extraits des documents (cliquer pour agrandir)'));
    q.si.forEach(src=>w.append(h('button',{type:'button',onclick:()=>lightbox(src),'aria-label':'Agrandir l’extrait'},h('img',{src,alt:'Extrait de la documentation officielle',loading:'lazy'}))));
    kids.push(w);
  }
  return h('div',{class:'blk src'},kids);
}
function explBlock(q){
  return h('div',{class:'blk'},h('h3',null,'Explication'),h('p',null,q.e));
}
function exhibits(q){ return q.x.length? h('div',{class:'exh'},q.x.map(s=>h('img',{src:s,alt:'Exhibit de la question'}))):null; }
function recon(q){ return q.r? h('p',{class:'flag'},'Question reconstituée de mémoire après un passage d’examen : la formulation est approximative.'):null; }

/* SUMMARY (numbering follows the source list) */
function legend(){
  return h('div',{class:'legend'},
    DOMS.map(d=>h('span',null,h('i',{class:'dot d'+d.k}),d.n.split(' (')[0])),

function gridEl(onPick,cur,enabled){
  return h('div',{class:'sum',role:'list'},Q.map(q=>{
    const st=prog[q.id]===1?' ok':prog[q.id]===0?' ko':'';
    const on=!enabled||enabled.has(q.id);
    const state=prog[q.id]===1?'réussie':prog[q.id]===0?'ratée':'pas encore vue';
    return h('button',{type:'button',role:'listitem',class:'sq b'+q.c[0]+st+(q.id===cur?' cur':''),disabled:!on,
      'aria-label':'Question '+q.id+', '+dom(q.c[0]).n+', '+state,onclick:()=>onPick(q.id)},q.id);
  }));

function jump(id){
  clearInterval(timer);
  if(S && S.mode==='exam' && S.qs.some(q=>q.id===id)){ S.i=S.qs.findIndex(q=>q.id===id); timer=setInterval(()=>{const e=document.getElementById('clock'); if(e) e.textContent=fmt(Math.floor((Date.now()-S.t0)/1000))},1000); question(); return; }
  const i=Q.findIndex(q=>q.id===id);
  S={mode:'train',qs:Q.slice(),i,ans:{},done:{},t0:Date.now()};
  question();
}
function openSummary(cur){
  const enabled = S && S.mode==='exam' ? new Set(S.qs.map(q=>q.id)) : null;
  const close=()=>{o.remove();document.removeEventListener('keydown',esc)};
  const esc=e=>{if(e.key==='Escape')close()};
  const o=h('div',{class:'modal',role:'dialog','aria-label':'Sommaire des questions',onclick:e=>{if(e.target===o)close()}},
    h('div',{class:'card'},
      h('div',{class:'row',style:'justify-content:space-between'},h('h2',null,'Sommaire'),h('button',{class:'btn',onclick:close},'Fermer')),
      legend(), gridEl(id=>{close();jump(id)},cur,enabled)));
  document.body.append(o); document.addEventListener('keydown',esc);
}

/* SESSION */
let S=null, timer=null;
function start(over){
  const c=Object.assign({},cfg,over||{});
  let pool=Q.slice();
  if(c.scope.startsWith('d')) pool=pool.filter(q=>q.c[0]===c.scope.slice(1));
  else if(c.scope.startsWith('o:')) pool=pool.filter(q=>q.c===c.scope.slice(2));
  else if(c.scope==='wrong') pool=pool.filter(q=>prog[q.id]===0);
  else if(c.scope==='new') pool=pool.filter(q=>prog[q.id]==null);
  if(!pool.length){ pool=Q.slice(); }
  pool=shuffle(pool);
  if(c.count!=='all') pool=pool.slice(0,+c.count);
  S={mode:c.mode,qs:pool,i:0,ans:{},done:{},t0:Date.now(),ord:{}};
  pool.forEach(q=>{ S.ord[q.id]=shuffle([...Array(q.o.length).keys()]); });
  clearInterval(timer);
  if(S.mode==='exam') timer=setInterval(()=>{const e=document.getElementById('clock'); if(e) e.textContent=fmt(Math.floor((Date.now()-S.t0)/1000))},1000);
  question();
}
function record(q,ok){ prog[q.id]=ok?1:0; save(prog); }
function question(){
  saveSession();
  const q=S.qs[S.i], total=S.qs.length, exam=S.mode==='exam';
  if(!S.ord) S.ord={};
  const ord = S.ord[q.id] || (S.ord[q.id]=shuffle([...Array(q.o.length).keys()]));
  const sel=S.ans[q.id]; const done=!!S.done[q.id];
  const right=h('div',{class:'row'},
    exam? h('span',{class:'chip mono',id:'clock'},fmt(Math.floor((Date.now()-S.t0)/1000))):null,
    h('button',{class:'btn',onclick:()=>openSummary(q.id)},'Sommaire'),
    h('button',{class:'btn ghost',onclick:()=>{clearInterval(timer);if(Object.keys(S.ans).length===0)clearSession();home()}},'Quitter'));
  const fs=h('div',{class:'opts',role:'radiogroup','aria-label':'Réponses'});
  ord.forEach((oi,k)=>{
    const t=q.o[oi];
    let cls='opt'; let tag=null;
    if(done){ if(oi===q.a[0]){cls+=' good';tag='Bonne réponse'} else if(oi===sel){cls+=' wrong';tag='Votre réponse'} }
    else if(sel===oi) cls+=' sel';
    const b=h('button',{type:'button',class:cls,role:'radio','aria-checked':String(sel===oi),disabled:done,onclick:()=>{S.ans[q.id]=oi;question()}},
      h('span',{class:'ltr'},L[k]),h('span',null,t,tag?h('span',{class:'tag'},tag):null));
    fs.append(b);
  });
  const last=S.i===total-1;
  const nodes=[topbar(right),
    h('div',{class:'qhead'},h('span',{class:'mono muted'},'Q'+q.id+' · '+(S.i+1)+' sur '+total),chip(q)),
    h('div',{class:'prog'},h('i',{style:'width:'+Math.round(((S.i+(done?1:0))/total)*100)+'%'})),
    recon(q), h('p',{class:'stem'},q.q), exhibits(q), fs];
  if(!exam && !done){
    nodes.push(h('div',{class:'nav'},h('span'),h('button',{class:'btn primary',disabled:sel==null,onclick:()=>{S.done[q.id]=1;record(q,sel===q.a[0]);question()}},'Valider')));
  } else if(!exam && done){
    const ok=sel===q.a[0];
    nodes.push(h('div',{class:'fb'},
      h('div',{class:'verdict '+(ok?'ok':'ko')},ok?'Bonne réponse.':'Réponse incorrecte. La bonne réponse est '+L[ord.indexOf(q.a[0])]+'.'),
      explBlock(q),sourcesBlock(q)));
    nodes.push(h('div',{class:'nav'},h('span'),h('button',{class:'btn primary',onclick:()=>{ if(last) results(); else {S.i++;question()} }},last?'Voir les résultats':'Question suivante')));
  } else {
    nodes.push(h('div',{class:'nav'},
      h('button',{class:'btn',disabled:S.i===0,onclick:()=>{S.i--;question()}},'Précédente'),
      last? h('button',{class:'btn primary',onclick:()=>{ if(S.qs.some(x=>S.ans[x.id]==null) && !confirmFinish) {confirmFinish=true;question();return} results() }},confirmFinish?'Terminer quand même':'Terminer')
          : h('button',{class:'btn primary',onclick:()=>{S.i++;question()}},'Suivante')));
    if(last && confirmFinish) nodes.push(h('p',{class:'muted',style:'margin-top:10px'},'Certaines questions n’ont pas de réponse : elles seront comptées comme fausses.'));
  }
  mount(...nodes);
}
let confirmFinish=false;
function results(){
  clearInterval(timer); confirmFinish=false; clearSession();
  const exam=S.mode==='exam';
  if(exam) S.qs.forEach(q=>record(q,S.ans[q.id]===q.a[0]));
  const ok=S.qs.filter(q=>S.ans[q.id]===q.a[0]); const wrong=S.qs.filter(q=>S.ans[q.id]!==q.a[0]);
  const pct=Math.round(ok.length/S.qs.length*100);
  const bars=DOMS.map(d=>{
    const qs=S.qs.filter(q=>q.c[0]===d.k); if(!qs.length) return null;
    const g=qs.filter(q=>S.ans[q.id]===q.a[0]).length;
    return h('div',{class:'bar'},h('span',null,h('i',{class:'dot d'+d.k,style:'margin-right:8px'}),d.n.split(' (')[0]),h('div',{class:'tr'},h('i',{class:'d'+d.k,style:'width:'+Math.round(g/qs.length*100)+'%'})),h('span',{class:'mono'},g+' / '+qs.length));
  });
  const secs=Math.floor((Date.now()-S.t0)/1000);
  mount(topbar(h('button',{class:'btn ghost',onclick:home},'Accueil')),
    h('h1',null,'Résultats'),
    h('div',{class:'card',style:'margin-top:16px'},
      h('div',{class:'row',style:'gap:24px;align-items:flex-end'},h('div',{class:'score'},ok.length+' / '+S.qs.length),h('div',null,h('div',{class:'mono'},pct+' %'),h('div',{class:'muted'},'Durée : '+fmt(secs)))),
      h('div',{class:'bars'},bars)),
    h('div',{class:'row',style:'margin:18px 0'},
      h('button',{class:'btn primary',onclick:()=>start({scope:'wrong',count:'all',mode:cfg.mode})},'Refaire mes questions ratées'),
      h('button',{class:'btn',onclick:home},'Retour à l’accueil')),
    wrong.length? h('h2',{style:'margin:24px 0 4px'},'À revoir ('+wrong.length+')'):h('p',null,'Aucune erreur sur cette série.'),
    wrong.map(q=>detail(q,S.ans[q.id],true)));
}

/* LIST + DETAIL */
function detail(q,picked,open){
  const body=h('div',{class:'body'},
    recon(q), exhibits(q),
    h('div',null,q.o.map((t,k)=>h('div',{class:'lopt'+(k===q.a[0]?' good':'')},h('b',null,L[k]),h('span',null,t,k===q.a[0]?' — bonne réponse':'',picked===k&&k!==q.a[0]?' — votre réponse':'')))),
    explBlock(q),sourcesBlock(q));
  return h('details',{class:'it',open:open||false},
    h('summary',null,h('span',{class:'n'},'Q'+q.id),h('span',null,q.q.length>170?q.q.slice(0,170)+'…':q.q)),body);
}
function listView(scope){
  let f='all', text='';
  const holder=h('div');
  const chips=h('div',{class:'filters',role:'group','aria-label':'Filtrer par domaine'});
  const input=h('input',{type:'search',id:'q',placeholder:'Rechercher dans les questions, réponses et sources',oninput:e=>{text=e.target.value.toLowerCase();draw()}});
  function draw(){
    chips.replaceChildren(...[['all','Tous']].concat(DOMS.map(d=>[d.k,d.n.split(' (')[0]])).map(([k,t])=>
      h('button',{class:'fchip','aria-pressed':String(f===k),onclick:()=>{f=k;draw()}},t)));
    const rows=Q.filter(q=>(f==='all'||q.c[0]===f)&&(!text||(q.q+' '+q.o.join(' ')+' '+q.e+' '+q.s.join(' ')+' '+q.qt.join(' ')).toLowerCase().includes(text)));
    holder.replaceChildren(h('p',{class:'muted'},rows.length+' question'+(rows.length>1?'s':'')),...rows.map(q=>h('div',null,h('div',{style:'margin-top:12px'},chip(q)),detail(q,null,false))));
  }
  draw();
  mount(topbar(h('button',{class:'btn ghost',onclick:home},'Accueil')),h('h1',null,'Toutes les réponses'),h('p',{class:'lead',style:'margin-top:8px'},'Questions, bonnes réponses, explications et sources, sans passer par le quiz.'),h('div',{style:'margin-top:14px'},input),chips,holder);
}
home();
</script>
