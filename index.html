<title>Entraînement FASS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a black equipment-panel look with orange as the only loud colour; a weighted exam-blueprint bar and a numbered index grid are the signature elements. */
:root{
  --bg:#0a0a0a; --surface:#141414; --surface2:#1c1c1c; --ink:#f3f1ee; --muted:#a6a39e; --line:#2f2d2b;
  --accent:#ff5a1f; --accent-ink:#0a0a0a; --ok:#5bd68a; --okbg:#10281a; --bad:#ff7a70; --badbg:#321512; --warn:#ffb340; --warnbg:#2a1d08;
  --d1:#6ea8ff; --d2:#b48cff; --d3:#ffb340; --d4:#3dd6b0; --d5:#f4709b;
  --f-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --on-ok:#0a0a0a; --on-bad:#0a0a0a;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f6f4f1; --surface:#ffffff; --surface2:#efece8; --ink:#1b1917; --muted:#5d5954; --line:#d8d3cc;
  --accent:#d13d08; --accent-ink:#ffffff; --ok:#17803f; --okbg:#e2f4e9; --bad:#c0322a; --badbg:#fbe5e2; --warn:#9a5b00; --warnbg:#fff0d4;
  --on-ok:#ffffff; --on-bad:#ffffff;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-sans);margin:0;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-cond);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,5vw,2.8rem);letter-spacing:-.01em}
h2{font-size:1.45rem}
h3{font-size:1.1rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.88em}
.muted{color:var(--muted)}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;gap:10px;align-items:center;font-family:var(--f-cond);font-weight:600;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase}
.mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:.8rem;letter-spacing:0}
h1 em{font-style:normal;color:var(--accent)}
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin-top:12px}
.sq{font-family:var(--f-mono);font-size:.9rem;background:var(--surface2);border:1px solid var(--line);border-bottom:4px solid var(--line);border-radius:6px;padding:8px 0 6px;min-height:44px;text-align:center;color:var(--ink)}
.sq:hover{border-color:var(--accent)}
.sq.b1{border-bottom-color:var(--d1)}.sq.b2{border-bottom-color:var(--d2)}.sq.b3{border-bottom-color:var(--d3)}.sq.b4{border-bottom-color:var(--d4)}.sq.b5{border-bottom-color:var(--d5)}
.sq.ok{color:var(--ok);background:var(--okbg)}.sq.ko{color:var(--bad);background:var(--badbg)}
.sq.cur{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:40;display:grid;place-items:start center;padding:24px 16px;overflow:auto}
.modal .card{max-width:760px;width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 14px;font-weight:500;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.lead{max-width:62ch;color:var(--muted)}
.note{background:var(--warnbg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:.92rem;max-width:80ch}
.note b{color:var(--warn)}
.srcs .sgrp{margin-top:18px}
.srcs h3{font-size:1.1rem;padding-bottom:6px;border-bottom:1px solid var(--line)}
.srcs ul{list-style:none;margin:0;padding:0}
.srcs li{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.srcs li .muted{font-size:.82rem;text-align:right;flex:0 1 55%}
@media (max-width:560px){.srcs li{flex-direction:column;gap:2px}.srcs li .muted{text-align:left;flex:none}}
/* blueprint bar */
.bp{display:flex;height:44px;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:22px 0 6px}
.bp div{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.82rem;font-weight:500;color:#0a0a0a;min-width:0;padding-inline:4px;white-space:nowrap;overflow:hidden}
.bp .c1{background:var(--d1)}.bp .c2{background:var(--d2)}.bp .c3{background:var(--d3)}.bp .c4{background:var(--d4)}.bp .c5{background:var(--d5)}
.bpl{font-size:.82rem;color:var(--muted);margin-bottom:26px}
/* session panel */
.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;align-items:end;margin-top:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
select{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-height:42px;width:100%}
.chk{display:flex;gap:8px;align-items:center;min-height:42px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:.92rem;color:var(--muted)}
.stats b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
/* domains */
.doms{display:grid;gap:16px;margin-top:22px}
.dom{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dom>header{display:flex;gap:14px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface2)}
.dom .pct{font-family:var(--f-mono);font-size:1.7rem;font-weight:500;line-height:1}
.dom .tt{display:flex;gap:12px;align-items:baseline;min-width:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.d1{background:var(--d1)}.d2{background:var(--d2)}.d3{background:var(--d3)}.d4{background:var(--d4)}.d5{background:var(--d5)}
.dom .cours{padding:12px 18px 0;font-size:.9rem;color:var(--muted)}
.obj{list-style:none;margin:0;padding:8px 18px 14px}
.obj li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.obj li:first-child{border-top:0}
.obj .code{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.obj .cnt{font-family:var(--f-mono);font-size:.85rem;white-space:nowrap}
.obj button{padding:5px 10px;min-height:34px;font-size:.88rem}
@media (max-width:560px){.obj li{grid-template-columns:auto 1fr;}.obj .cnt,.obj button{grid-column:2}.obj .cnt{margin-top:-4px}}
/* quiz */
.qhead{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.chip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 8px;font-size:.84rem}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.prog>i{display:block;height:100%;background:var(--accent)}
.stem{font-size:1.12rem;font-weight:500;white-space:pre-wrap;margin-bottom:14px}
.opts{display:grid;gap:10px;margin:0;padding:0;border:0}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .ltr{font-family:var(--f-mono);font-weight:500;width:26px;height:26px;border-radius:5px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-size:.9rem}
.opt.sel{border-color:var(--accent);background:var(--surface2)}
.opt.sel .ltr{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.good .ltr{background:var(--ok);color:var(--on-ok);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .ltr{background:var(--bad);color:var(--on-bad);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.opt .tag{display:block;font-size:.8rem;font-weight:600;margin-top:2px}
.opt.good .tag{color:var(--ok)}.opt.wrong .tag{color:var(--bad)}
.exh{display:grid;gap:8px;margin:0 0 14px}
.exh img,.shot img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
.fb{margin-top:18px;display:grid;gap:14px}
.verdict{padding:10px 14px;border-radius:6px;font-weight:600}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.ko{background:var(--badbg);color:var(--bad)}
.blk{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:14px 16px;display:grid;gap:10px}
.blk h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:var(--f-sans);font-weight:600}
.src p{font-size:.94rem;overflow-wrap:anywhere}
.src p+p{border-top:1px dashed var(--line);padding-top:10px}
blockquote{margin:0;border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:.93rem;color:var(--ink);overflow-wrap:anywhere}
.shot{display:grid;gap:6px}
.shot button{border:0;background:none;padding:0;text-align:left;cursor:zoom-in}
.shot small{color:var(--muted)}
.flag{font-size:.82rem;background:var(--warnbg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:20px}
/* results */
.score{font-family:var(--f-mono);font-size:clamp(2.2rem,8vw,3.6rem);font-weight:500;line-height:1}
.bars{display:grid;gap:10px;margin-top:14px}
.bar{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:12px;align-items:center;font-size:.92rem}
.bar .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .tr i{display:block;height:100%}
@media (max-width:520px){.bar{grid-template-columns:1fr auto}.bar .tr{grid-column:1/-1;order:3}}
/* list */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input[type=search]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px}
details.it{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:10px}
details.it>summary{cursor:pointer;padding:12px 14px;list-style:none;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline}
details.it>summary::-webkit-details-marker{display:none}
details.it>summary .n{font-family:var(--f-mono);color:var(--muted)}
details.it .body{padding:0 14px 14px;display:grid;gap:12px}
.lopt{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:6px 10px;border-radius:6px}
.lopt.good{background:var(--okbg);color:var(--ink);outline:1px solid var(--ok)}
.lopt b{font-family:var(--f-mono)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:18px;z-index:50;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
.foot{margin-top:40px;font-size:.84rem;color:var(--muted);max-width:80ch}
@media (prefers-reduced-motion:no-preference){.prog>i{transition:width .25s ease}}
</style>

<script>
const Q = [{"id": 1,"c": "2.01","q": "An HP-UX host is newly connected and the customer reports LUN enumeration problems. Which FlashArray setting should the Support Specialist verify first?","o": ["The LUN is 256 or higher","The host group assignment and volume mappings for the HP-UX host","The host personality assigned to that host"],"a": [2],"e": "La documentation relie directement la personnalité HP-UX à la façon dont ce système gère l'énumération des LUN, et la donne comme obligatoire pour rattacher un hôte HP-UX. Par défaut, aucune personnalité n'est définie sur un hôte : sur un hôte HP-UX tout juste connecté, c'est donc le premier réglage à contrôler. A est écartée : le seuil « LUN ID supérieur à 255 » est cité dans la documentation pour les personnalités ESXi, Hitachi-VSP et Oracle-VM-Server, pas pour HP-UX. B (host group et mappages) reste à vérifier, mais seulement ensuite : un mappage manquant rend un volume invisible, il ne produit pas un problème d'énumération propre à HP-UX.","s": ["FlashArray Connectivity — Host Personality in Purity › Host Personalities in Purity (1er paragraphe), p. 17 : La personnalité HP-UX existe pour s'adapter à la façon dont ce système « manages LUN enumeration ». C'est la source la plus directe.","FlashArray Connectivity — Host Personality in Purity › tableau « Personality / OS », ligne HP-UX, p. 19 : Personnalité HP-UX requise pour le rattachement des hôtes HP-UX. Le critère « LUN ID supérieur à 255 » figure sur les lignes ESXi, Hitachi-VSP et Oracle-VM-Server.","FlashArray Connectivity — Host Personality in Purity › Configuring Personality (note), p. 19 : La personnalité doit être définie à la création de l'hôte ; la modifier ensuite peut provoquer un logout/login de l'hôte.","purity_fa_admin_guide_pdf_6122.pdf (Purity//FA Administration Guide 6.12.2) — Chapter 2 FlashArray Concepts and Features › Block Storage › Hosts (avant-dernier paragraphe avant « Host Guidelines »), p. 30 : Un hôte sous HP-UX doit avoir la personnalité HP-UX ; par défaut, la personnalité n'est pas définie.","purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › purehost › option –personality, p. 278 (syntaxe p. 276) : Valeur CLI « hpux » ; l'option règle la façon dont Purity ajuste le protocole entre la baie et l'initiateur.","FASS_Module02_Software_FR.docx (support vidéo FASS, module 02) — Tableau de synthèse › Utilisation de la GUI et de la CLI › ligne « Personnalité de l'hôte (personality) », p. 4 : Un décalage de personnalité cause des problèmes de compatibilité ; « personality mismatch » fait partie des objectifs du module (p. 7)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 2,"c": "2.01","q": "An array has triggered \"Alert 194 -- Insecure Default pureuser Password.\" What action should the Support Specialist take to resolve this alert?","o": ["Run pureadmin setattr –password pureuser","Run pureadmin reset pureuser –lockout","Reset the password for pureuser in Pure1."],"a": [0],"e": "L'article de l'alerte 194 donne exactement cette commande dans sa rubrique « Resolution » : elle sert à remplacer le mot de passe par défaut du compte pureuser. Tout mot de passe autre que « pureuser » fait disparaître l'alerte au cycle de vérification suivant. B est écartée : d'après le guide CLI, pureadmin reset –lockout sert à déverrouiller un utilisateur bloqué après trop d'échecs de connexion, il ne change pas le mot de passe. C'est la réponse piège : le document Pure1 Manage -- Dashboard mentionne bien l'IAM de Pure1 comme autre moyen de changer le mot de passe de pureuser, mais dans le cadre du score « Password Hygiene » de Pure1, pas dans l'article de l'alerte 194. La résolution officielle de l'alerte est la commande CLI exécutée sur la baie.","s": ["Purity__FA Alerts — Self-Help Alerts › Alert 194 - Insecure Default pureuser Password › Resolution, p. 293-294 (début de l'article p. 292) : Résolution : changer le mot de passe de pureuser avec pureadmin setattr –password pureuser. La note précise que tout mot de passe autre que « pureuser » résout l'alerte. C'est la source la plus directe.","Purity__FA Alerts — Alert 194 › Alert Example (Suggested Action) et Impact, p. 293 : Action suggérée : changer maintenant le mot de passe de pureuser. Impact : le mot de passe par défaut est un risque de sécurité.","purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › pureadmin › option –password, « Note on the Default Password » et Example 6, p. 57, 60 et 65 : –password change le mot de passe d'un utilisateur local ; l'exemple 6 montre la commande exacte avec les invites ancien / nouveau mot de passe.","purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › pureadmin › option –lockout et Example 10, p. 56 et 65 : pureadmin reset –lockout déverrouille un utilisateur après le nombre maximal d'échecs de connexion (écarte la réponse B).","purity_fa_admin_guide_pdf_6122.pdf (Purity//FA Administration Guide 6.12.2) — GUI Overview › GUI Login (1er paragraphe), p. 90 : Compte pureuser livré avec le mot de passe initial « pureuser », à changer dès la première connexion avec pureadmin setattr –password.","Pure1 Manage - Dashboard — Security Assessment › « How to turn the 'Default Password Changed' Green? », p. 17-18 : Cite deux voies pour le score Pure1 : l'IAM de Pure1 ou la CLI (même commande pureadmin). À connaître pour comprendre la réponse C."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 3,"c": "2.02","q": "During a health check, all active host connections are concentrated through one controller. What risk should the Support Specialist identify?","o": ["Due to the imbalance, NPIV will not work correctly and may cause host level issues during a failover.","A controller failover could cause avoidable host impact because pathing is not balanced.","Imbalance is likely to trigger an Out of Memory (OOM) condition on the controller servicing most host connections."],"a": [1],"e": "La procédure de health check demande de vérifier que les hôtes sont connectés de façon égale aux deux contrôleurs et que les E/S sont équilibrées. Elle précise que si des hôtes n'ont des E/S que sur un seul contrôleur, tout basculement sera perturbant pour eux. Le guide d'administration dit de même que des chemins vers un seul contrôleur affectent la haute disponibilité. Le risque est donc un impact hôte lors d'un failover, évitable en rééquilibrant les chemins. A est écartée : la documentation présente NPIV comme le mécanisme qui maintient les connexions hôtes actives quand un contrôleur est hors ligne ; aucun des documents fournis ne dit qu'un déséquilibre de chemins empêche NPIV de fonctionner. C est écartée : aucun des passages sur l'équilibrage des chemins ou des E/S ne mentionne un risque de saturation mémoire (OOM). Les conséquences citées sont la haute disponibilité et, côté performances, un contrôleur qui sert plus d'E/S que l'autre.","s": ["Purity__FA General Administration — Doing a Health Check on a FlashArray › Live on the Array - Command-Line Health Checks › Check IOBalance (paragraphe sous l'exemple « Pre-4.1.4 »), p. 34 (début de la rubrique p. 33) : Si des hôtes ont des E/S sur un seul contrôleur, ne pas poursuivre sans accord du client : sans MPIO correct, « any failover will be disruptive ». C'est la source la plus directe.","Purity__FA General Administration — Doing a Health Check on a FlashArray › Summarized Health Checks - Live CLI › Host/IO Check et Host Connectivity, p. 24 : Points de contrôle du health check : E/S équilibrées par hôte (purehost monitor –balance) et hôtes connectés de façon égale aux deux contrôleurs.","Purity__FA General Administration — Doing a Health Check on a FlashArray › Live on the Array - Command-Line Health Checks › Check Host Connections, p. 32 : En cas de connexions inégales des initiateurs, consulter le client.","purity_fa_admin_guide_pdf_6122.pdf (Purity//FA Administration Guide 6.12.2) — Health › Connections › statuts « Uneven » et « Single Controller », p. 351-352 : Single Controller : chemins vers un seul contrôleur, ce qui affecte la haute disponibilité ; prévoir des chemins redondants vers les deux contrôleurs.","m04-fasp-troubleshooting.pdf (support FASP, module 04) — Diapositive « CLI monitoring & validation », p. 13 : purehost monitor –balance vérifie le multipath ; en cas de déséquilibre, confirmer avec pureport list –initiator un chemin vers CT0 et CT1 pour chaque initiateur.","FlashArray Block Services — « How does NPIV work? », p. 25 : NPIV sert à garder les connexions hôtes actives quand un contrôleur est hors ligne (écarte la réponse A)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 4,"c": "3.01","q": "A Support Specialist is investigating a suspected Fibre Channel timeout and wants to review recent events from the Support Toolkit. Which command should the Support Specialist run?","o": ["fa check host-connectivity","fa timeline ctio","fa health fc"],"a": [1],"e": "Dans le Support Toolkit, la famille « fa timeline » affiche des chronologies d'événements, et sa sous-commande ctio liste les événements et erreurs CTIO (Continue Target Input/Output). La fiche de health check range « fa timeline ctio » sous l'intitulé « CTIO Timeout and Port (FC/ETH) Events » : c'est donc la commande qui montre les timeouts récents côté ports. A est écartée : « fa check host-connectivity » est un contrôle de configuration qui montre comment les hôtes sont connectés aux contrôleurs, pas un historique d'événements. C est écartée : la liste des outils « fa » ne contient pas de sous-commande fc sous « fa health » (on y trouve ac, failover, general, hardware, perf, etc.). Le Fibre Channel apparaît sous « fa counters fc », « fa info fc » et « fa timeline ».","s": ["Support Toolkit — FlashArray Support Toolkit › Listing All the Available 'fa' Support Tools › Answer (Command Map, branche « timeline »), p. 13 : timeline = chronologies d'événements et de statistiques ; ctio = événements et erreurs CTIO. C'est la source la plus directe.","Support Toolkit — Listing All the Available 'fa' Support Tools › Answer (Command Map, branches « check » et « health »), p. 12 : host-connectivity = connectivité des hôtes entre contrôleurs (contrôle de configuration). La branche health ne contient aucune sous-commande fc (écarte A et C).","Dark Site Support — Technical Support › FlashArray On-Premises Dark Site Health Checks › Execution › Option #2 - Off Box (tableau, ligne « Port Connectivity »), p. 110 : Ligne « CTIO Timeout and Port(FC/ETH) Events (Support Toolkit) » : fa timeline fc –days 3 et fa timeline ctio –days 3.","FlashArray Performance — Troubleshooting › Performance Troubleshooting › Collecting Information › Determine Whether Or Not Best Practices Are In Use, p. 55 : fa timeline ctio et fa counters servent à voir si les ports SAN / FlashArray sont sains ; un grand nombre de timeouts CTIO est à faire corriger par le client.","FlashArray Block Services — How to Map Out Which Port is Connected to the Initiator and Target (étape 1, points d et e), p. 214 : fa timeline fc montre l'activité des ports (logins, logouts) ; host-connectivity montre quels WWN d'hôtes sont connectés aux ports de la baie."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 5,"c": "2.04","q": "A customer wants to use the Self-Service Upgrade (SSU) feature in Pure1 on a supported FlashArray. Which environment should the Support Specialist identify as eligible?","o": ["A FlashArray running the Edge Services Entitlement Agent","A FlashArray that regularly phones home and under an active support contract","A FlashArray with a current ASP contact within Pure1"],"a": [1],"e": "Le guide de démarrage rapide SSU répond directement à la question « votre baie est-elle prise en charge ? » : la SSU s'adresse aux FlashArray qui font leur phone home et qui sont sous contrat de support Pure actif (pas de souscription expirée). Les prérequis détaillés confirment : phone home activé, et contrat de souscription non expiré. A est écartée : l'agent Entitlement sert à aligner les réglages de performance des baies Evergreen//One sur la souscription, il n'a pas de rôle dans la SSU. L'agent exigé pour la SSU est le Purity//FA Upgrade Agent. C est écartée : un partenaire (ASP) peut aider ou réaliser une SSU s'il est ajouté comme utilisateur externe avec le rôle Operator, mais la présence d'un contact ASP n'est pas un critère d'éligibilité de la baie.","s": ["Pure1 Manage - Dashboard — Pure1 Manage - Software Lifecycle › Purity Upgrades › Pure1 SSU Quick Start Guide › « Step 1: Is your appliance supported? », p. 72 : La SSU prend en charge les FlashArray « phoning-home » sous contrat de support Pure actif, sans souscription expirée. C'est la source la plus directe.","Pure1 Manage - Dashboard — Purity Upgrades › Self-Service Upgrades Prerequisites (1er paragraphe et critères 1 à 8), p. 76 : SSU disponible pour les FlashArray qui font leur phone home ; critère 3 : Phonehome, Edge Management et Edge Agent Update activés ; critère 5 : Purity//FA Upgrade Agent installé ; critère 8 : contrat de souscription non expiré.","Pure1 Manage - Dashboard — Purity Upgrades › Self-Service Upgrades and Partners, p. 80 : Conditions pour qu'un partenaire réalise une SSU (compte Pure1, rôle Operator donné par le client). Ce n'est pas un critère d'éligibilité de la baie (écarte C).","Pure1 Manage - Troubleshooting — Pure1 Manage - Edge Service › Entitlement Agent Release Notes (1er et 2e paragraphes), p. 79 : L'agent Entitlement tourne sur les baies Evergreen//One et maintient les réglages de performance conformes à la souscription (écarte A).","FASS_Module05_Install_Upgrade_FR.docx (support vidéo FASS, module 05) — Tableau de synthèse « Prérequis de la SSU » ; slide « Prérequis pour utiliser la SSU » (vidéo à 19:23), p. 2 et p. 23 : Prérequis : compte Pure1 administrateur avec authentification renforcée, Purity 6.2.10 ou plus, phone home activé (site connecté), Edge Services activés avec l'agent de mise à jour Purity.","Purity__FA Purity__FA Upgrades — Upgrading Purity//FA › Purity//FA Self-Service Upgrade via Array CLI (introduction), p. 4 : Phonehome doit être activé et fonctionnel pour que la baie puisse télécharger le bundle Purity."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 6,"c": "4.01","q": "A customer asks where to install the FlashArray Support Toolkit before uploading extracted logs for analysis. What should the Support Specialist recommend?","o": ["Install it on a separate machine where the logs are placed after extraction","Install it on the host that is generating the workload and read the array logs remotely","Install it directly on both FlashArray controllers."],"a": [0],"e": "Le guide du Support Toolkit le dit à trois endroits, presque dans les mêmes mots que la réponse A : l'outil s'exécute sur une machine séparée, où l'on dépose les fichiers de logs après les avoir extraits du système. C est écartée explicitement : l'installation sur un système en production (« live system ») n'est ni approuvée, ni recommandée, ni supportée. L'installation n'est supportée que sur une machine externe aux systèmes en production, sous l'un des OS listés. B est écartée : le Toolkit travaille sur des logs extraits et copiés localement (dossier /support/logs), pas sur une lecture à distance depuis un hôte de production.","s": ["Support Toolkit — FlashArray Support Toolkit › Installing the FlashArray Support Toolkit (paragraphe sous le tableau Download / Version), p. 4 : Installation sur un système en production non approuvée, non recommandée, non supportée ; exécuter l'outil sur une machine séparée « where the log files are placed after extracting ». C'est la source la plus directe.","Support Toolkit — Support Toolkit (introduction, dernier paragraphe), p. 3 : Même consigne : exécuter l'outil sur une machine séparée où les logs sont déposés après extraction.","Support Toolkit — Installing the FlashArray Support Toolkit › Additional Information, p. 6 : Consigne répétée une troisième fois ; l'exécutable « fa » est la commande de base de tous les outils.","Support Toolkit — FlashArray Support Toolkit › Formatting the FlashArray Log Directory, p. 6 : Les logs sont extraits localement dans /support/logs avec fa dump bundle (le Toolkit lit des logs locaux, pas distants).","Support Toolkit — Installing the FlashArray Support Toolkit › System Requirements, p. 4-5 : OS testés pour la machine d'analyse (Debian, Ubuntu, CentOS, processeur x86)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 7,"c": "4.01","q": "A host owner reports intermittent slow reads from a volume connected to all hosts on FlashArray in an iSCSI environment. The Support Specialist has GUI access and CLI access and needs to determine where the delay is coming from. What should they review first?","o": ["Review the host personality settings to ensure that it adheres to the best practices.","Review the Analysis → Performance → Host, select Metrics → Read.","Review the Analysis → Performance → Volumes, select Metrics → Read."],"a": [2],"e": "Pour savoir d'où vient un délai, la formation FASS indique de commencer par Analysis > Performance et de sélectionner un seul type d'E/S : la latence est alors décomposée en SAN time (externe à la baie), QoS rate limit time, queue time et service time (internes). Le symptôme porte ici sur les lectures, d'où Metrics → Read. Entre B et C : la plainte porte sur un volume précis, et ce volume est connecté à tous les hôtes. L'onglet Volumes permet de le sélectionner et de voir sa latence de lecture décomposée, quel que soit l'hôte ; l'onglet Hosts montrerait l'ensemble des volumes d'un hôte, sans isoler le volume en cause. C'est pourquoi C est retenue, avec la réserve indiquée plus haut. A est écartée : la personnalité d'hôte est un réglage de compatibilité fixé à la création de l'hôte. Elle n'explique pas des lenteurs intermittentes et ne permet pas de localiser un délai ; la vérification des bonnes pratiques vient après la mesure.","s": ["FASS_Module03_Performance_FR.docx (support vidéo FASS, module 03) — Slide « Exemple : inspecter la latence en écriture (1/3) » et transcription à 33:26, p. 26-27 : Première chose à faire : sélectionner un seul flux d'E/S ; la latence est alors décomposée en SAN time, QoS rate limit time, queue time et latence, plus un total.","FASS_Module03_Performance_FR.docx (support vidéo FASS, module 03) — Slide « Analyse des performances (GUI : Analysis) » et transcription de 09:51 à 10:46, p. 15-16 : Un seul type d'E/S sélectionné = décomposition de la latence ; « très utile » pour savoir si elle vient du stockage ou de facteurs externes. On peut ensuite sélectionner un volume, un groupe de volumes, un hôte ou un groupe d'hôtes.","FASS_Module03_Performance_FR.docx (support vidéo FASS, module 03) — Tableau de synthèse « Dépannage de la latence : checklist », ligne « Où regarder », p. 2 : GUI Analysis > Performance avec un seul type d'E/S, puis statistiques par volume (jusqu'à 5).","purity_fa_admin_guide_pdf_6122.pdf (Purity//FA Administration Guide 6.12.2) — Analysis › Performance › Volumes (et « Metrics selection »), p. 327-328 : Onglet Volumes : sélection de volumes (5 au maximum) pour les graphiques ; cases à cocher pour filtrer le type d'E/S (Read, Write, Mirrored Write).","purity_fa_admin_guide_pdf_6122.pdf (Purity//FA Administration Guide 6.12.2) — Analysis › Performance › Understanding the Performance Charts, p. 329 : Définitions : SAN Time = transfert entre l'initiateur et la baie ; Queue Time et Service Time = temps dans la baie ; Total = somme. Les mêmes graphiques existent sur les onglets Array, Volumes, Pods, Hosts.","m04-fasp-troubleshooting.pdf (support FASP, module 04) — Diapositives « Latency: not workload-related » et sur le volet Performance, p. 24 et p. 22 : SAN time élevé = transferts lents sur le SAN ou initiateur occupé ; le volet Performance sous Analysis est le meilleur endroit pour commencer à enquêter sur la latence."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 8,"c": "2.04","q": "Before a Self-Service Upgrade (SSU), Pure1 shows the EMS Agent or Gateway status as \"Unhealthy.\" What should the Support Specialist recommend?","o": ["Renew the expired step-up authentication (MFA) in Pure1","Open a support ticket and wait until the agent or gateway issue is corrected","Apply the edge_agent_config Pure1 optimization to the array"],"a": [1],"e": "Le contrôle de santé EmsHealthCheck vérifie, avant une SSU, que les agents des services de gestion Edge (EMS) sont sains. Pour tous ses messages d'erreur, l'action recommandée est de contacter le support technique. De même, pour une passerelle Edge Service au statut « Unhealthy », la documentation renvoie vers le Support Center de Pure1. Il faut donc ouvrir un ticket et ne lancer la SSU qu'une fois le problème corrigé. A est écartée : l'authentification renforcée (step-up) est un prérequis du compte Pure1 de l'utilisateur ; elle n'a pas de lien avec l'état de santé de l'agent ou de la passerelle sur la baie. C est écartée : aucun des documents fournis ne mentionne d'optimisation « edge_agent_config ». Les optimisations Purity de Pure1 sont des correctifs logiciels, pas un remède à un agent ou une passerelle en défaut.","s": ["Pure1 Manage - Troubleshooting — Health Checks for Self-Service Upgrades › EmsHealthCheck (tableau Message / Recommended Action), p. 25 (début de la rubrique p. 10) : Le contrôle vérifie que les agents EMS sont sains ; action recommandée pour chaque message : contacter Everpure Technical Services. C'est la source la plus directe.","Pure1 Manage - Troubleshooting — Pure1 Manage - Edge Service › About the Gateway and Agents › Understanding the Gateway Status (ligne « Unhealthy »), p. 64 : Unhealthy : la passerelle ne fonctionne pas comme prévu, ce qui peut affecter l'usage de Pure1 Edge Service ; passer par le menu d'action de la baie vers le Support Center.","Purity__FA Purity__FA Upgrades — Upgrade Reference › Self-Service Upgrade Checks › ligne EmsHealthCheck (ems_health_check.py), p. 121 (début de l'article p. 117) : Vérifie la santé des services EMS avant qu'un client réalise une SSU ; contrôle propre à la SSU.","Pure1 Manage - Dashboard — Purity Upgrades › Self-Service Upgrades Prerequisites (critères 2 et 3), p. 76 : L'authentification renforcée concerne le compte Pure1 Manage ; Phonehome, Edge Management et Edge Agent Update concernent la baie (écarte A).","Pure1 Manage - Dashboard — Security Assessment › liste des indicateurs, ligne « Purity Optimizations », p. 16 : Les optimisations Purity sont des correctifs logiciels recommandés pour la santé et la sécurité de la baie (écarte C)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 9,"c": "5.03","q": "A customer wants to place several block volumes and one file system in the same ActiveDR pod so they can fail over together. How should the Support Specialist meet this requirement?","o": ["Place the block volumes and file system in the same pod, but in different protection groups.","Use one mixed pod, but disable snapshots on the file system first.","Use separate pods because an ActiveDR pod cannot contain both block volumes and file systems."],"a": [2],"e": "La FAQ ActiveDR pour les services de fichiers pose exactement la question et répond non : un pod ne peut pas contenir à la fois des volumes bloc et des systèmes de fichiers, il faut des pods séparés pour répliquer les deux. La même règle est rappelée dans la procédure de création du pod, dans le support FASP et dans la vidéo FASS. A et B sont écartées pour la même raison : toutes deux supposent un pod mixte, ce que Purity n'autorise pas. Ni des protection groups distincts, ni la désactivation des snapshots ne lèvent cette limite.","s": ["ActiveDR — ActiveDR for File Services › question « Can pods contain block volumes and file systems at the same time? », p. 17 : Réponse : non. Des pods séparés sont nécessaires pour répliquer des volumes bloc et des systèmes de fichiers. C'est la source la plus directe.","ActiveDR — Setup Active DR Replication › étape 1 (note), p. 66-67 : Note à la création du pod : « A Pod cannot contain both File Systems and Block Volumes. »","FlashArray File ServicesFlashArray File Services — Setup Active DR Replication › étape 1 (note), p. 371 : Même note dans la procédure côté FA File.","m06-fasp-fa-file-services.pdf (support FASP, module 06) — Diapositive « Requirements », point 01 Pods, p. 34 : Les pods ne peuvent pas contenir à la fois volumes bloc et systèmes de fichiers ; des pods séparés doivent être utilisés.","FASS_Module04_FA_File_Services_FR.docx (support vidéo FASS, module 04 FA File) — Tableau « Réplication de fichiers (ActiveDR) », ligne Pod ; transcription à 14:38, p. 2 et p. 19 : Un pod ne peut pas contenir à la fois du bloc et du fichier : pods séparés pour le bloc ActiveDR et pour le fichier ActiveDR."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 10,"c": "2.01","q": "What is the role of the fleet coordinator in relation to remote operations in Everpure's Fusion architecture?","o": ["Remote operations between arrays in the fleet depend directly on the fleet coordinator.","The fleet coordinator is the main point for executing all remote operations, including API calls.","The fleet coordinator manages array membership and certificate rotation, but remote operations can function independently of it."],"a": [2],"e": "Le guide d'administration Fusion le dit en toutes lettres : le fleet coordinator n'est pas critique pour les opérations distantes, qui se font directement entre les baies et ne dépendent pas de lui. Son rôle est de gérer l'appartenance des baies à la flotte et la rotation des certificats des membres. La réponse C reprend ces deux points. A et B sont écartées par la même phrase du guide : les opérations distantes (par exemple purevol create –context arrayB) passent directement d'une baie à l'autre, sans transiter par le coordinateur.","s": ["Everpure Fusion Fusion Administration Guide — Everpure Fusion Administration Guide › Fusion Requirements and Recommendations › Recommendations (liste à puces sur le fleet coordinator), p. 4-5 : Le coordinateur n'est pas critique pour les opérations distantes ; elles se font directement entre baies et « do not depend on the fleet coordinator ». Il gère l'appartenance à la flotte et la rotation des certificats. C'est la source la plus directe.","Everpure Fusion Fusion Administration Guide — Everpure Fusion Administration Guide › Secure Communications in Arrays, p. 5 : Communications de la flotte en mTLS avec un certificat commun, renouvelé périodiquement.","FASS_Module02_Software_FR.docx (support vidéo FASS, module 02) — Tableau de synthèse Fusion, ligne « Fleet coordinator », p. 3 : Responsable : configuration et objets de flotte, ajout / retrait de membres, rotation des certificats. Pas responsable : exécution distante ni opérations de baie.","Everpure Fusion — Encadré « Important » sur les communications de flotte, p. 49 : Une baie qui rejoint la flotte reçoit une clé contenant l'adresse IP du fleet coordinator et l'utilise pour s'inscrire (rôle d'appartenance)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 11,"c": "3.04","q": "Alert 10193 indicates that the management certificate is nearing expiration. The customer wants to renew the CA-signed certificate while retaining the existing certificate name and service bindings. What should the Support Specialist do to meet this requirement?","o": ["Extend the certificate with purecert setattr –self-signed –retain","Delete the certificate and import a new certificate under a different name.","Generate a CSR for the existing certificate name, have the CA sign it, and import the signed certificate."],"a": [2],"e": "L'article de l'alerte 10193 décrit précisément ce cas dans sa rubrique « Refresh an Expiring CA-Signed Certificate » : générer une CSR pour le nom de certificat existant (ce qui laisse les services pointer vers le même nom), la faire signer par la CA, puis réimporter le certificat signé sous ce même nom. A est écartée : la prolongation par setattr –self-signed ne concerne que les certificats auto-signés créés sur la baie. Le client veut ici garder un certificat signé par sa CA. B est écartée : changer de nom est justement ce que le client ne veut pas, puisque les services sont rattachés au nom du certificat.","s": ["Purity__FA Alerts — Self-Help Alerts › Alert 10193 - Certificate Expiry Alert › Resolution › « Refresh an Expiring CA-Signed Certificate (or Rotate to a CA-Signed Certificate) », étapes 1 à 3, p. 504-505 : 1. CSR pour le nom de certificat existant, « this keeps the services pointing to the same name », signature par la CA. 2. Récupérer la CSR signée. 3. Importer le certificat signé sous le même nom. C'est la source la plus directe.","Purity__FA Alerts — Alert 10193 › Resolution › « Update a Self-Signed (\"Appliance\") Certificate in Place », p. 504 : La prolongation avec purecert setattr –self-signed –days s'applique à un certificat auto-signé créé sur la baie (écarte A).","Purity__FA Alerts — Alert 10193 › Details, Impact et Cause for this Alert, p. 503-504 : Alerte levée quand un certificat géré par purecert approche de l'expiration ou a expiré ; un certificat expiré peut bloquer l'accès à la GUI et à l'API REST.","purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › purecert › Certificate Signing Request, p. 149-150 : Pour un certificat de CA, construire d'abord une CSR sur la baie avec purecert csr create ; les attributs du certificat actuel sont réutilisés ; puis importer le certificat signé.","FASS_Module02_Software_FR.docx (support vidéo FASS, module 02) — Tableau de synthèse Certificats, ligne « Cycle de vie », p. 6 : Cycle de vie : générer une CSR, la faire signer par une CA, importer le certificat signé et les CA intermédiaires."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 12,"c": "1.01","q": "A customer reports receiving Alert 201 (Critical Rebuild) after performing annual power maintenance at their site. They are concerned about data integrity. What guidance should the Support Specialist provide?","o": ["The alert indicates a temporary rebuild state that will resolve automatically unless it persists.","The rebuild is critical and may risk data integrity, so the customer should contact Support immediately.","The array should be power cycled again to restart the rebuild from the last known good state."],"a": [0],"e": "Malgré son nom, l'alerte 201 est de sévérité Warning et son action suggérée est « No Action needed ». Elle apparaît quand la baie a été éteinte longtemps puis rallumée : Purity reconstruit alors les données des modules DirectFlash, justement pour préserver l'intégrité des données. Une fois la reconstruction terminée, l'alerte se résout seule et la baie fonctionne normalement. Il ne faut contacter le support que si la situation persiste plus de 24 heures. B est écartée : la reconstruction protège l'intégrité des données, elle ne la menace pas, et aucun contact immédiat avec le support n'est demandé. Le seul effet possible est une baisse temporaire des performances d'E/S. C est écartée, et c'est même l'action interdite : l'alerte dit en majuscules de ne pas éteindre la baie tant que la reconstruction n'est pas terminée.","s": ["Purity__FA Alerts — FlashArray Support Case Alerts › Alert 201 - Critical Rebuild › Resolution, p. 131 : Durées attendues (12 h pour les modules de 24 To, 24 h pour les plus gros) ; à la fin du processus l'alerte se résout et la baie fonctionne normalement ; contacter le support si le problème persiste plus de 24 heures. C'est la source la plus directe.","Purity__FA Alerts — Alert 201 › Alert Example (texte de l'alerte et « Suggested Action »), p. 129-130 : Reconstruction nécessaire pour maintenir l'intégrité des données ; « DO NOT power off the array until this rebuild is complete » ; action suggérée : aucune action requise (écarte C).","Purity__FA Alerts — Alert 201 › Alert Information et Impact, p. 130 : Sévérité Warning, type Sev3 ; une dégradation des performances d'E/S est possible pendant la reconstruction, puis retour à la normale (écarte B).","Purity__FA Alerts — Alert 201 › Causes for this alert, p. 130-131 : La baie a été éteinte pendant une longue période avant d'être rallumée ; Purity donne la priorité à la reconstruction pour garantir la cohérence des données."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 13,"c": "4.01","q": "A VMware administrator says that one Virtual Machine on a datastore backed by FlashArray seems slow. The VM is on a host connected using Fibre Channel. The Support Specialist wants to locate the source of latency. What should they examine first?","o": ["In the GUI, navigate to Analysis → Performance → Hosts and review the metrics for the host.","Check the FlashArray Fibre Channel counters to find which port is causing the issue.","Check the VM topology section in Pure1 for details to see where the latency occurs."],"a": [2],"e": "Le problème porte sur une seule VM. La vue VM Topology de Pure1 (VM Analytics) donne une représentation visuelle du chemin d'E/S depuis la VM jusqu'au FlashArray : disque de la VM, VM, hôte, datastore, volume, baie. Elle associe les statistiques VMware à celles de la baie, ce qui aide à identifier à quel niveau le problème se produit. C'est donc le premier endroit où regarder pour savoir si la lenteur vient du stockage ou de la couche VMware. A est écartée comme premier réflexe : Analysis → Performance → Hosts montre l'activité de tout l'hôte ESXi vue de la baie, toutes VM confondues. On n'y distingue pas la VM lente et on ne voit rien de ce qui se passe côté VMware. B est écartée : contrôler les compteurs Fibre Channel suppose déjà que la cause est un port. C'est une vérification à faire ensuite, si la vue de bout en bout désigne le chemin SAN.","s": ["m03-fasp-monitoring.pdf (support FASP, module 03) — Diapositive « Pure1 VM Topology », p. 21 : Représentation visuelle du chemin d'E/S de la VM jusqu'au FlashArray ; aide à identifier où un problème se produit ; montre sur quels volumes et baies tournent les applications. C'est la source la plus directe.","Module02_Monitoring_FR_PAGINE.docx (support vidéo FASP, module 02 Monitoring) — Section « 4. VM Analytics et Full Stack Analytics », transcription de 15:10 à 17:36, p. 12 : Un collecteur vCenter remonte les statistiques VMware dans Pure1, qui les associe à celles de la baie : performance de bout en bout, identification rapide des problèmes entre le stockage et la VM, statistiques à chaque niveau (baie, volume, datastore, hôte, VM, disque).","Pure1 Manage - Troubleshooting — Tableau des rôles Pure1 (Role / Access), ligne « VM Viewer », p. 83 : Confirme l'existence d'une page « VM Topology » dans Pure1 Manage (rôle VM Viewer limité à cette page).","purity_fa_admin_guide_pdf_6122.pdf (Purity//FA Administration Guide 6.12.2) — Analysis › Performance › Hosts, p. 328 : L'onglet Hosts analyse les performances par hôte ou groupe d'hôtes, sans détail par VM (écarte A comme première étape).","Dark Site Support — FlashArray On-Premises Dark Site Health Checks › Execution › Option #2 (tableau, ligne « Port Connectivity »), p. 110 : Les compteurs FC (fa counters fc) relèvent du contrôle de la connectivité des ports, une vérification ciblée (réponse B)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 14,"c": "4.01","q": "What is occurring with a device if there is a slow drain in a Fibre Channel (FC)?","o": ["It regulates FC frames to prevent them from being sent more quickly than they are received.","It incorrectly sends FC frames to multiple targets causing link saturation.","It is unable to process and acknowledge FC frames as quickly as they are received."],"a": [2],"e": "C'est la définition donnée par la documentation, presque mot pour mot : un équipement en slow drain n'arrive pas à traiter et acquitter les trames FC aussi vite qu'il les reçoit. Le phénomène est lié au contrôle de flux « buffer to buffer » : l'émetteur ne récupère plus ses crédits assez vite et doit suspendre ses envois. Il peut se propager dans la fabric et ralentir du trafic sans rapport avec l'équipement fautif. A est écartée : réguler le débit des trames entre deux nœuds, c'est la description du contrôle de flux buffer to buffer (B2B), le mécanisme normal, pas du slow drain qui en est un dysfonctionnement. B est écartée : aucun des passages sur le slow drain ne parle de trames envoyées par erreur à plusieurs cibles. Les causes citées sont la congestion B2B et la perte de crédits B2B.","s": ["FlashArray Block Services — FlashArray Block - Troubleshooting › Slow Drain › « What is Slow Drain? », p. 204 : Un équipement en slow drain « is not able to process and acknowledge FC frames » aussi vite qu'il les reçoit ; lié au contrôle de flux buffer to buffer ; peut se propager dans la fabric. C'est la source la plus directe.","FlashArray Block Services — Slow Drain › « What are Buffer to Buffer credits / flow control? », p. 204 : Le contrôle de flux B2B est la façon FC de contrôler le débit de trames échangées entre deux nœuds (c'est ce que décrit la réponse A).","FlashArray Block Services — Slow Drain › « How does B2B credit work? » et « What causes slow drain? », p. 205 : Slow drain quand la cible tarde à renvoyer les R_RDY : le crédit d'émission tombe à 0 et l'envoi s'arrête. Deux types : congestion B2B (la plus courante) et perte B2B.","FlashArray Block Services — Slow Drain › « Troubleshooting Slow Drain (Switch) », p. 206 : Causes les plus courantes : matériel défectueux, problèmes de pilote ou de firmware.","FlashArray Performance — Définitions du SAN Time (latence SAN), p. 19 : Les équipements en slow drain (FC) figurent parmi les causes de latence SAN, c'est-à-dire extérieures au FlashArray.","FASS_Module03_Performance_FR.docx (support vidéo FASS, module 03) — Objectifs du module, p. 1 : Les situations de slow drain font partie des goulots d'étranglement à savoir identifier."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 15,"c": "1.03","q": "A customer has received a FA//XL R5 that is running a factory image. What should the Support Specialist do first to make the array operational?","o": ["Run puresetup newarray","Run pureadm start","Run pureinstall with a GA release of Purity//FA"],"a": [2],"e": "Une baie neuve arrive avec une image d'usine, pas avec une version courante de Purity. Cette image ne peut pas démarrer Purity et ne prend en charge ni puresetup ni pureadm start (erreur « Purity is in manufacturing mode »). La résolution donnée par la documentation est d'installer une version GA de Purity avec pureinstall, puis de démarrer dessus ; ensuite seulement Purity peut démarrer et puresetup fonctionne normalement. A et B sont écartées par le même passage : ce sont précisément les deux commandes que la documentation montre en échec sur une image d'usine. Elles ne deviennent utilisables qu'après l'installation de la version GA.","s": ["Purity__FA Purity__FA Upgrades — Upgrading Purity//FA › FlashArray Installation: Changing Purity//FA Version on a New FlashArray › FA Factory Image for MFG › « Resolution to solve the above failures », p. 45 : La baie doit être installée (pureinstall) avec une version GA de Purity, puis démarrée dessus ; Purity peut alors démarrer et puresetup fonctionne. C'est la source la plus directe.","Purity__FA Purity__FA Upgrades — FA Factory Image for MFG › Impact et « Highlight that differentiates Factory image from GA Purity », p. 44 : L'image d'usine ne peut pas démarrer Purity et ne prend en charge ni puresetup ni pureadm start ; la version voulue de Purity doit être déployée sur site à l'installation.","Purity__FA Purity__FA Upgrades — FA Factory Image for MFG › Examples (« pureadm start fails... », « puresetup fails... »), p. 45 : Exemples des deux commandes en échec avec l'erreur « Purity is in manufacturing mode » (écarte A et B).","Purity__FA Purity__FA Upgrades — Changing Purity//FA Version on a New FlashArray › Installing Purity on FA with Factory Image (introduction et étape 11), p. 50 et p. 53 : Une baie neuve reçue sur site tourne normalement sur une image d'usine ; la procédure installe la version GA avec pureinstall suivi du fichier .ppkg, contrôleur par contrôleur.","FASS_Module05_Install_Upgrade_FR.docx (support vidéo FASS, module 05) — Slide sur la mise à jour de Purity contrôleur par contrôleur, transcription à 08:40 ; tableau de synthèse « Installation », p. 13 et p. 1 : Connecté en puresetup, lancer pureinstall purity<Tab> : Purity est installé sur la partition alternative, puis vérification avec pureboot list et redémarrage."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 16,"c": "4.03","q": "What is a contributing factor to system space appearing in the FlashArray GUI?","o": ["RAID/Parity overhead","Increased volume usage","Reclaimable space backlog"],"a": [2],"e": "L'espace système n'apparaît dans la GUI que lorsque trois catégories internes dépassent ensemble un budget prédéfini : surcharge RAID / parité, espace récupérable, et données nouvellement écrites pas encore attribuées. L'article « Why did system space start showing on the array? » liste ensuite les causes les plus courantes de cette apparition : toutes tournent autour d'un retard de récupération ou de comptabilisation de l'espace, dont les réécritures, snapshots et unmaps continus qui créent un arriéré de travail de récupération. Les supports de formation disent la même chose : si la garbage collection ne suit pas, l'espace système augmente. A est le piège : la surcharge RAID / parité fait bien partie des trois catégories, mais c'est une composante normale et stable, prévue dans le budget. Elle ne figure pas dans la liste des causes qui font apparaître l'espace système, contrairement à l'arriéré de récupération. B est écartée : l'utilisation des volumes est une catégorie d'espace distincte dans la GUI, elle n'entre pas dans la définition de l'espace système. Une forte activité d'écriture n'y contribue qu'indirectement, par le retard de comptabilisation qu'elle crée.","s": ["FlashArray Space — Space Reference › System Space Explained › « Why did system space start showing on the array? » (liste des causes les plus courantes), p. 4-5 : Causes citées : réécritures, snapshots et unmaps continus qui créent « a backlog of reclaimable work » ; arriéré de comptabilisation ; charge excessive ; processus de récupération inefficace. C'est la source la plus directe.","flasharray_space_why_did_system_space_start_showing_on_the_array__2026-11-02-16-15-24 — Why did system space start showing on the array? (liste à puces), p. 3 : Même liste de causes, dans l'article exporté seul.","FlashArray Space — Space Reference › System Space Explained (1er paragraphe et liste des trois catégories), p. 4 : L'espace système est l'espace qui dépasse un budget interne pour trois catégories : Raid/Parity overhead, Reclaimable space, données nouvellement écrites non attribuées. C'est ce passage qui rend la réponse A défendable.","m04-fasp-troubleshooting.pdf (support FASP, module 04) — Diapositive « System-wide garbage collection », p. 31 : Si la garbage collection ne parvient pas à récupérer l'espace, l'espace système peut augmenter.","FASS_Module03_Performance_FR.docx (support vidéo FASS, module 03) — Tableau « Espace : catégories et seuils », ligne System Space ; tableau de dépannage de l'espace, p. 2-3 : System Space = surcharge RAID, espace de garbage collection et unknown ; une hausse brutale de l'espace système correspond à un arriéré de garbage collection."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 17,"c": "5.03","q": "What happens to ActiveDR replication if a prolonged network outage causes the RPO to exceed 20 minutes?","o": ["ActiveDR uses asynchronous replication to resync, then returns to continuous mode.","ActiveDR automatically switches to synchronous replication mode.","ActiveDR maintains continuous replication regardless of network conditions."],"a": [0],"e": "La FAQ ActiveDR le dit presque dans les mêmes mots que la réponse A : quand le RPO dépasse 20 minutes, ActiveDR passe sur le moteur de réplication asynchrone pour se resynchroniser, puis revient au mode normal de réplication continue. La documentation appelle cet état le mode de transfert périodique, et 20 minutes est le seuil de resynchronisation. B est écartée : ActiveDR ne passe jamais en synchrone ; la réplication synchrone est le domaine d'ActiveCluster. Le repli se fait vers l'asynchrone (transferts périodiques). C est écartée : le mode continu n'est justement pas maintenu au-delà de 20 minutes de retard, ActiveDR quitte ce mode le temps de rattraper.","s": ["ActiveDR — FlashArray ActiveDR - Overview › Replication Networks FAQ › « How does ActiveDR handle temporary replication network outages? », p. 12 : Pour un RPO supérieur à 20 minutes, ActiveDR passe au moteur de réplication asynchrone « to resync » puis revient au mode de réplication continue normal. C'est la source la plus directe.","ActiveDR — ActiveDR Performance FAQ › « When does ActiveDR transition between continuous replication mode and periodic transfer mode? », p. 16-17 : Passage du mode continu au mode de transfert périodique si le RPO (lag) des pods dépasse 20 minutes ; conditions du retour au mode continu.","ActiveDR — Replication Network Requirements (comportements quand la bande passante de réplication est dépassée), p. 23 : Le RPO augmente jusqu'au seuil de resynchronisation (actuellement 20 minutes), puis bascule du moteur ActiveDR vers le moteur de réplication périodique (resync) pour rattraper les changements.","ActiveDR — ActiveDR FAQ › « Does ActiveDR automatically resync? », p. 7 : ActiveDR tente automatiquement de se resynchroniser après une coupure.","FASS_Module04_02_ActiveWorkload_ActiveDR_Offload_FR.docx (support vidéo FASS, module 04) — Tableau « Choisir la réplication : récapitulatif » ; slide sur le fonctionnement d'ActiveDR, p. 1 et p. 7-8 : ActiveDR = flux continu quasi synchrone, ni planifié comme l'asynchrone ni acquitté sur les deux baies comme le synchrone (écarte B) ; ActiveCluster = synchrone actif-actif."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 18,"c": "3.01","q": "After a proxy change, a customer reports that phonehome is no longer working. The Support Specialist wants to test connectivity from the array to the phonehome servers. Which CLI command should they run?","o": ["puresupport test –proxy","purearray test pinghome","purecert list –refresh"],"a": [1],"e": "Le guide CLI décrit purearray test pinghome comme la commande qui teste la capacité de la baie à se connecter au support technique en établissant une connexion sécurisée (SSH ou HTTPS). C'est exactement un test de connectivité entre la baie et les serveurs phonehome. La commande voisine purearray test phonehome va un cran plus loin en vérifiant en plus l'échange de messages de test. A est écartée : la syntaxe de puresupport test n'accepte que les options –phonehome et –remoteassist ; il n'existe pas d'option –proxy. C est écartée : purecert gère les certificats SSL, sans rapport avec un test de connectivité, et sa commande list n'a pas d'option –refresh.","s": ["purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › purearray › paragraphe sur les tests à la demande (« Purity//FA can test certain array functionality on demand »), p. 113 : purearray test pinghome teste la capacité de la baie à se connecter au support technique par une connexion SSH ou HTTPS sécurisée ; purearray test phonehome y ajoute la vérification de l'échange de messages de test. C'est la source la plus directe.","How to Test Phone Home — How to Test Phone Home (KB0014005) › Answer, p. 3-4 : Pour tester le phone home, lancer purearray test phonehome (résultat attendu : « Test upload successful ») ; en cas d'échec, vérifier la configuration Pure1 Cloud et RemoteAssist.","purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › puresupport › Synopsis et Troubleshooting, p. 676 et p. 683 : Syntaxe : puresupport test [–phonehome] [–remoteassist], sans option –proxy ; puresupport test –phonehome affiche l'état actuel du phone home (écarte A).","purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › purecert › Synopsis, p. 144 : purecert crée et gère les certificats SSL ; purecert list n'a pas d'option –refresh (écarte C)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 19,"c": "5.06","q": "A protection group replication relationship stopped progressing after repeated network problems, and the target now shows the protection group as disallowed. After the network issue is corrected, what action is required to resume replication?","o": ["Allow the protection group again on the source array.","Delete the source snapshots so the target can recreate the replication history.","Allow the protection group again on the target array."],"a": [2],"e": "Ce scénario est celui de l'alerte 52 (« Replication ... Is Not Progressing: Protection Group Disallowed »). Son article précise que la réplication ne reprendra pas tant que le problème n'est pas résolu et que le groupe de protection n'est pas remis à « allowed » sur la cible. La résolution donne la commande à lancer depuis la baie cible : purepgroup allow, ou dans la GUI Protection > Protection Groups > Target Protection Groups > Allow. A est écartée : l'autorisation (allow / disallow) est un réglage de la baie cible. Le guide d'administration indique que ce sont les administrateurs des baies cibles qui autorisent ou non la réplication asynchrone. B est écartée : aucune étape de la résolution ne demande de supprimer des snapshots ; il suffit de corriger le réseau puis de ré-autoriser le groupe.","s": ["Purity__FA Alerts — Self-Help Alerts › Alert 52 - Protection Group {} Replication to {} IS Not Progressing: Protection Group Disallowed › Resolution, étapes 5 et 6, p. 222 : Un pgroup à l'état (disallowed) doit être ré-autorisé ; après résolution du problème, ré-autoriser les pgroups « from the target array » avec purepgroup allow ou par la GUI (Target Protection Groups > Allow). C'est la source la plus directe.","Purity__FA Alerts — Alert 52 › Details, p. 220 : La réplication ne reprend pas tant que le problème n'est pas résolu et que le groupe n'est pas remis à « allowed » sur la cible.","Purity__FA Alerts — Alert 52 › Alert Example et Causes for This Alert, p. 219-221 : Texte de l'alerte : réplication incapable de progresser à cause de problèmes réseau répétés ; causes : perte totale de paquets, congestion excessive, timeouts TCP.","purity_fa_admin_guide_pdf_6122.pdf (Purity//FA Administration Guide 6.12.2) — Protection › Protection Groups (rôle des baies cibles) ; procédure « Allowing Protection Group Replication », p. 310 et p. 318 : Les administrateurs des baies cibles autorisent ou interdisent la réplication asynchrone ; la procédure pour l'autoriser commence par « Log in to the target array » (écarte A).","purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › purepgroup-setattr › purepgroup allow / disallow, p. 446-447 et p. 452 : Pour autoriser la réplication, lancer purepgroup allow sur la baie cible ; (disallowed) s'affiche à côté du nom de la baie qui a interdit la réplication ; l'argument s'écrit source:pgroup."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 20,"c": "5.02","q": "What does ActiveWorkload allow an array to do?","o": ["Connect and establish synchronous replication over IP and FC with up to five other arrays.","Connect and establish asynchronous replication over IP with up to five other arrays.","Connect and establish synchronous replication over Fibre Channel with up to five other arrays."],"a": [0],"e": "La FAQ ActiveWorkload définit la fonction ainsi : elle permet à une baie de se connecter et d'établir une réplication synchrone avec jusqu'à 5 autres baies, pour déplacer des charges de travail sans interruption. La question suivante de la FAQ précise le transport : 5 connexions de réplication synchrone, dont jusqu'à 2 peuvent être en Fibre Channel. IP et FC sont donc tous deux pris en charge, ce qui correspond à la réponse A. B est écartée : ActiveWorkload repose sur la réplication synchrone et le mécanisme de pod étiré d'ActiveCluster, pas sur l'asynchrone. C est écartée : le Fibre Channel est limité à 2 connexions au maximum ; le total de cinq baies n'est atteignable qu'avec l'IP.","s": ["ActiveWorkload — ActiveWorkload FAQ › « What is ActiveWorkload? », p. 5 : Permet à une baie « to connect and establish synchronous replication » avec jusqu'à 5 autres baies et d'utiliser le clustering étiré pour déplacer les charges. C'est la source la plus directe.","ActiveWorkload — ActiveWorkload FAQ › « Does ActiveWorkload work with FC or IP? », p. 5 : À partir de Purity//FA 6.5.0 : 5 connexions de réplication synchrone, dont 2 au maximum en Fibre Channel (écarte C).","ActiveWorkload — ActiveWorkload › Key Features, p. 4 : Réplication synchrone temporaire avec plusieurs baies : IP jusqu'à 5 baies, Fibre Channel jusqu'à 2 connexions ; transport mixte pris en charge ; même moteur synchrone qu'ActiveCluster (écarte B).","ActiveWorkload — ActiveWorkload (introduction) et « How it Works », étape 1, p. 3 : Mobilité des charges sans interruption entre jusqu'à cinq FlashArray grâce à la réplication synchrone ; la baie peut avoir une réplication synchrone avec jusqu'à 5 baies.","FASS_Module04_02_ActiveWorkload_ActiveDR_Offload_FR.docx (support vidéo FASS, module 04) — Slide « Vue d'ensemble d'ActiveWorkload » (0:09) et slide suivante, p. 4-5 (tableau de synthèse p. 1) : Connecter jusqu'à cinq FlashArray ; jusqu'à 5 baies appariées par connexion synchrone ; disponible depuis Purity//FA 6.4.0."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 21,"c": "3.03","q": "A customer running Purity//FA 6.10.3 needs to host two separate file service environments on one FlashArray while keeping their shares, exports, and directory service configurations separate. What should the Support Specialist recommend to meet these requirements?","o": ["Configure FlashArray File Multi-Server with separate logical file servers and independent namespaces and configurations.","Configure both environments on a single file server and use access permissions to separate their shares and exports.","Configure a separate realm for each environment to isolate their file services and configurations."],"a": [0],"e": "C'est exactement l'objet de la fonction FlashArray File Multi-Server, disponible depuis Purity//FA 6.8.7 (donc présente en 6.10.3) : créer plusieurs serveurs dans la baie, qui servent de conteneurs séparés pour des services d'annuaire, des exports et des utilisateurs locaux différents. Chaque serveur a son propre espace de noms, avec des noms de partages et d'exports dédiés, et ses services d'annuaire lui sont propres. B est écartée : sur un seul serveur, l'espace de noms des partages et exports et le service d'annuaire sont communs ; des permissions d'accès ne séparent pas les configurations d'annuaire. C est le distracteur : les realms servent au multitenancy (délégation d'administration, quotas, QoS par locataire). Ce sont les serveurs de fichiers de Multi-Server qui portent les services d'annuaire, les exports et l'espace de noms des partages ; c'est donc Multi-Server qui répond mot pour mot au besoin exprimé.","s": ["FlashArray File ServicesFlashArray File Services — FlashArray File - Deployment › Quick Start Guide (Purity//FA v6.8.7 and higher) › FlashArray File Multi-Server Feature Overview › Introduction, p. 123 : Fonction introduite en Purity//FA 6.8.7 : plusieurs serveurs dans la baie, conteneurs séparés « for different directory services, exports » et configurations d'utilisateurs et groupes locaux. C'est la source la plus directe.","FlashArray File ServicesFlashArray File Services — FAQ › FlashArray File Multi-Server (questions 1, 3 et 6), p. 23 : Scinder la baie en plusieurs serveurs avec isolation des données ; espace de noms unique par serveur, avec noms de partages et d'exports dédiés ; les services d'annuaire sont contenus dans chaque serveur.","FlashArray File ServicesFlashArray File Services — FAQ › « What are the in-depth features available with Multi-Server? » et limitations, p. 22 : Serveurs de fichiers autonomes reliés à un ou plusieurs services d'annuaire, VIF dédiées, espace de noms unique pour les partages et exports, jusqu'à 16 serveurs ; les exports sont rattachés à un serveur.","FlashArray File ServicesFlashArray File Services — Multi-Server Local Directory Services: Overview, p. 118 et p. 120 : Plusieurs serveurs de fichiers indépendants dans une même baie ; chaque serveur est un domaine d'authentification et de permissions isolé.","purity_fa_admin_guide_pdf_6122.pdf (Purity//FA Administration Guide 6.12.2) — FlashArray Concepts and Features › Realms and Multitenancy, p. 19-20 : Les realms servent au multitenancy : délégation d'administration et contrôle de consommation (quotas, QoS) par locataire ; ils contiennent entre autres des serveurs (contexte de la réponse C)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 22,"c": "2.03","q": "While configuring LDAP on a FlashArray, some checks return results that are shown in red. What should the Support Specialist do next?","o": ["Correct the directory configuration details and retest before enabling the service.","Replace the array management certificate and ignore the LDAP test results.","Enable the service so the failed tests refresh automatically."],"a": [0],"e": "La procédure de configuration des services d'annuaire le dit explicitement : si tous les résultats du test reviennent en vert, la configuration est validée ; si des cases reviennent en rouge, une entrée doit très probablement être corrigée pour refléter exactement les informations de l'annuaire. Les services d'annuaire ne s'activent qu'après un test entièrement réussi. C est écartée : c'est l'ordre inverse. Le guide d'administration et le guide CLI précisent tous deux que l'activation ne se fait qu'après la réussite des tests (pureds enable « only after pureds test passes »). B est écartée : rien dans la procédure ne relie un résultat rouge au certificat de gestion de la baie, et les résultats du test ne doivent pas être ignorés. Si le test échoue alors que tout semble correct des deux côtés, la consigne est d'ouvrir un ticket de support.","s": ["Directory Services on FlashArray — Directory Services Setup and Configuration › FlashArray-Side Configuration Using the FlashArray GUI: Purity Versions 5.3.x and Above, étapes 3 à 7 (« View the test results »), p. 22-23 : Cliquer sur Test ; tout en vert = configuration validée ; « If any boxes return red », une entrée doit très probablement être modifiée ; activer les services d'annuaire après un test réussi. C'est la source la plus directe.","Directory Services on FlashArray — Même procédure, étapes 5 et 6, p. 23 : Un échec peut aussi venir d'un accès bloqué au contrôleur de domaine ; si tout paraît correct et que le test échoue encore, ouvrir un ticket de support.","purity_fa_admin_guide_pdf_6122.pdf (Purity//FA Administration Guide 6.12.2) — Settings › Access › tests des services d'annuaire (« A typical workflow is », étapes 1 à 3), p. 418 : Configurer ou corriger les paramètres, lancer les tests et vérifier que tous les contrôles requis réussissent, puis activer la configuration seulement après la réussite des tests (écarte C).","purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › pureds › description de pureds test et Example 8, p. 209 et p. 217 : pureds test vérifie la résolution des URI, le bind et l'interrogation de l'annuaire ; pureds enable s'utilise uniquement après la réussite de pureds test.","Directory Services on FlashArray — « Invalid credentials » in pureds Test for LDAP Setup, p. 48 : Exemple d'échec de test dû à un paramètre de configuration (identifiants du compte de liaison) à corriger."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 23,"c": "3.03","q": "A customer wants to use the same FlashArray ports for file data and replication traffic to simplify cabling. What should the Support Specialist explain?","o": ["This design is only supported on FA//XC70R5, FA//XC90R5, and FA//XLR5 arrays.","This design is supported, but it requires that support add both the services to the ports.","That design is unsupported because the ports used for file traffic cannot be used for replication at the same time."],"a": [2],"e": "La FAQ ActiveDR pour les services de fichiers pose la question et répond non : faire passer à la fois la réplication et les données fichier sur les mêmes ports n'est pas pris en charge. Si l'on veut utiliser les ports de réplication par défaut (eth2/3) pour le trafic fichier, le support doit convertir leur service en iSCSI, et ces ports ne peuvent alors plus servir à la réplication. Le guide de démarrage FA File le répète : réplication et fichier ne peuvent pas partager les mêmes ports. B est le piège : le support intervient bien, mais pour convertir le service des ports vers l'iSCSI (fichier), ce qui les retire de la réplication. Il n'ajoute pas les deux services sur les mêmes ports. A est écartée : aucun des documents fournis ne prévoit d'exception par modèle de baie à cette règle.","s": ["ActiveDR — ActiveDR for File Services › « Is it possible to use the replication ports for both file and replication simultaneously? », p. 18 : Réponse : non. Le fichier demande 4 ports iSCSI ; des ports de réplication convertis en iSCSI par le support ne servent plus à la réplication ; faire tourner les deux sur les mêmes ports « is not supported ». C'est la source la plus directe.","FlashArray File ServicesFlashArray File Services — FlashArray File - Deployment › Quick Start Guide (Purity//FA v6.8.7 and higher) › Creating a New File Server (note sur les ports Ethernet), p. 138-139 : Les ports choisis ne doivent pas déjà être utilisés par un autre service ; les sous-interfaces ne peuvent pas partager des types de service : réplication et fichier ne peuvent pas partager les mêmes ports.","m06-fasp-fa-file-services.pdf (support FASP, module 06) — Diapositive « Requirements », point 03 iSCSI Ports, p. 34 : Le fichier demande 4 ports iSCSI pour les données ; faire tourner réplication et données fichier sur les mêmes ports n'est pas pris en charge."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 24,"c": "3.02","q": "Before zoning a new Fibre Channel (FC) host, a Support Specialist needs to confirm the array FC port WWNs and their negotiated speeds from the array CLI. Which command should they run?","o": ["pureport list –initiator","fa counters fc","purenetwork fc list –all"],"a": [2],"e": "purenetwork fc list est la commande de la CLI de la baie qui liste les interfaces Fibre Channel avec, pour chaque port, les colonnes Name, Enabled, WWN, Speed et Services. C'est la seule des trois propositions qui donne à la fois le WWN et la vitesse de chaque port FC de la baie. A est écartée : avec l'option –initiator, pureport list affiche les IQN, NQN et WWN des hôtes (initiateurs) connus de la baie, pas la liste des ports de la baie ; et le guide précise que la sortie de pureport list ne contient pas d'information sur les interfaces réseau (donc pas de vitesse), en renvoyant vers purenetwork. B est écartée : fa counters fc est un outil du Support Toolkit, qui s'exécute sur des logs extraits et non dans la CLI de la baie, et il affiche l'historique des compteurs des ports FC, pas leurs WWN et vitesses.","s": ["purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › purenetwork › Fibre Channel Interfaces (exemple de sortie), p. 374 : Pour lister uniquement les interfaces Fibre Channel, utiliser purenetwork fc list ; l'exemple montre les colonnes Name, Enabled, WWN, Speed, Services. C'est la source la plus directe.","m02-fasp-administration.pdf (support FASP, module 02) — Diapositive « View network configuration », p. 53 : Exemple réel de purenetwork fc list : pour chaque port CTx.FCx, le WWN et la vitesse (16.00 Gb/s).","purity_fa_cli_guide_pdf_6122.pdf (Purity//FA CLI Guide 6.12.2) — Purity//FA CLI Commands › pureport › Description, p. 586 : pureport list affiche les WWN des ports cibles ; –initiator affiche les IQN, NQN et WWN des hôtes ; la sortie ne contient pas d'information sur les interfaces réseau, pour lesquelles il faut voir purenetwork (écarte A).","FlashArray Block Services — FlashArray Block - Troubleshooting › Locating Port WWN for SAN Zoning › Locating the pWWN's on the Pure FlashArray, p. 196 : Pour le zoning, les pWWN de la baie se lisent avec pureport list (sans –initiator) : cette commande donne les WWN mais pas les vitesses.","Support Toolkit — Listing All the Available 'fa' Support Tools › Answer (Command Map, branche « counters »), p. 12 : fa counters fc = historique des compteurs des ports Fibre Channel, outil du Support Toolkit (écarte B)."],"qt": [],"x": [],"si": [],"ns": false,"r": false},{"id": 25,"c": "5.05","q": "A customer is planning to transition from SnapToNFS to CloudSnap and upgrade their FlashArrays. What should the Support Specialist explain as an important limitation of this transition?","o": ["The SnapToNFS target must be disconnected before configuring a new CloudSnap target with a different name.","Both SnapToNFS and CloudSnap targets must be connected simultaneously to migrate snapshots.","The array must be upgraded to a supported Purity//FA version to avoid known CloudSnap issues during migration."],"a": [0],"e": "L'article « SnapToNFS transition to CloudSnap » donne la procédure et sa limitation : les connexions simultanées à une cible CloudSnap et à une cible SnapToNFS ne sont pa
